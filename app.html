const SPECIAL_PAYS = ['キャンセル','B空転','定額負け']; // 運賃合計から除外(障割は運賃には加算するので含めない)
const EXCLUDE_FROM_COUNT = ['キャンセル','B空転','障割','定額負け']; // 組数・単価計算から除外
const EXCLUDE_FROM_FARE = ['キャンセル','B空転','定額負け']; // 運賃合計から除外(障割は組数には数えないが運賃には加算する)
function netFare(e){ return (e.fare||0) - (e.toll||0) - (e.fee||0); }
function buildFareDetailHTML(entries){
  const mid = entries.filter(e=>{ const nf=netFare(e); return nf>=5000 && nf<10000; });
  const long = entries.filter(e=>netFare(e)>=10000);
  const midSum = mid.reduce((s,e)=>s+netFare(e),0);
  const longSum = long.reduce((s,e)=>s+netFare(e),0);
  function items(list){
    if(list.length===0) return `<div class="fare-empty">該当なし</div>`;
    return list.map(e=>`
      <div class="fare-item">
        <span class="fi-time">${fmtTime(e.time)}</span>
        <span class="fi-dist">${fmtKm(e.dist||0)}km</span>
        <span class="fi-type">${e.type||'GO'}</span>
        ${e.thanks?'<span class="fi-thanks">🎫サンキュー</span>':''}
        <span class="fi-fare">¥${fmtYen(netFare(e))}</span>
      </div>`).join('');
  }
  return `
  <div class="card-title" style="margin:8px 0 2px;">運賃別明細</div>
  <div class="fare-group">
    <div class="fare-group-title"><span>ミドル(¥5,000〜9,999)</span><span>${mid.length}件・¥${fmtYen(midSum)}</span></div>
    ${items(mid)}
  </div>
  <div class="fare-group">
    <div class="fare-group-title long"><span>ロング(¥10,000〜)</span><span>${long.length}件${long.length?'・¥'+fmtYen(longSum):''}</span></div>
    ${items(long)}
  </div>`;
}
function cashReceived(e){ return e.fare||0; } // 現金の場合は高速代・手数料も含めて代金全額を現金として計上
function isBillable(e){ return !EXCLUDE_FROM_COUNT.includes(e.pay); } // 組数(件数)に数えるか
function isFareable(e){ return !EXCLUDE_FROM_FARE.includes(e.pay); } // 運賃合計に加算するか(障割はtrue)
// 同時刻の複数記録(チケット/現金の分割払いなど)は同一案件とみなし、組数には1件として数える。
// 運賃はそれぞれの記録の分だけ加算するので、このdedupeは組数(件数)の集計にのみ使う。
function dedupeByTime(list){
  const seen = new Set();
  return list.filter(e=>{
    if(seen.has(e.time)) return false;
    seen.add(e.time);
    return true;
  });
}

// 乗務終了時に記録全体をざっと点検し、気づきにくいズレを一覧で知らせる。
function runIntegrityCheck(entries){
  const issues = [];
  if(!entries.length) return issues;
  const DIST_EXEMPT = ['キャンセル','B空転','障割','定額負け'];
  const sorted = [...entries].sort((a,b)=>a.time-b.time);
  const timesWithDist = new Set(entries.filter(e=>e.dist).map(e=>e.time));
  let distMissCount = 0, distRevCount = 0, zeroFareCount = 0;
  const timeCounts = {};
  sorted.forEach((e, idx)=>{
    const leg = legDist(sorted, idx);
    if(leg===null){
      if(e.dist){ distRevCount++; }
      else if(!DIST_EXEMPT.includes(e.pay) && !timesWithDist.has(e.time)){ distMissCount++; }
    }
    if(!DIST_EXEMPT.includes(e.pay) && netFare(e)<=0){ zeroFareCount++; }
    timeCounts[e.time] = (timeCounts[e.time]||0) + 1;
  });
  let dupTimeCount = 0;
  Object.values(timeCounts).forEach(c=>{ if(c>=3) dupTimeCount++; });
  if(distMissCount>0) issues.push(`距離が未入力の記録が${distMissCount}件あります`);
  if(distRevCount>0) issues.push(`距離が前の記録より逆行している記録が${distRevCount}件あります`);
  if(zeroFareCount>0) issues.push(`運賃が¥0以下の記録が${zeroFareCount}件あります(キャンセル等以外)`);
  if(dupTimeCount>0) issues.push(`同時刻に3件以上の記録がまとまっている時刻が${dupTimeCount}件あります(入力ミスの可能性)`);
  return issues;
}
// 点検結果を一覧表示し、「戻って確認する」か「このまま進む」かを選ばせる。問題が無ければ即座にonProceedを呼ぶ。
function confirmIntegrityThenProceed(entries, onProceed){
  const issues = runIntegrityCheck(entries);
  if(!issues.length){ onProceed(); return; }
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box">
      <div class="confirm-msg">気になる記録が見つかりました</div>
      <div style="text-align:left;font-size:11px;color:var(--text);margin-bottom:14px;">
        ${issues.map(t=>`<div style="margin-bottom:4px;">⚠ ${t}</div>`).join('')}
      </div>
      <div class="confirm-actions">
        <button class="confirm-cancel" id="integrityBackBtn">戻って確認する</button>
        <button class="confirm-ok" id="integrityProceedBtn">このまま進む</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('integrityBackBtn').onclick = ()=> overlay.remove();
  document.getElementById('integrityProceedBtn').onclick = ()=>{ overlay.remove(); onProceed(); };
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
}

// 距離入力は「降車時点の累計走行距離」。区間ごとの実距離を差分で求める。
// キャンセルなど距離を入力しない記録はスキップし、その前の「距離が入っている記録」を基準にする。
function legDist(sortedEntries, idx, startDist){
  const cur = sortedEntries[idx];
  if(cur.dist===null || cur.dist===undefined || cur.dist==='' || cur.dist===0) return null;
  let baseline = null;
  for(let j=idx-1; j>=0; j--){
    const pd = sortedEntries[j].dist;
    if(pd!==null && pd!==undefined && pd!=='' && pd>0){ baseline = pd; break; }
  }
  if(baseline===null){
    const sd = (startDist!==undefined) ? startDist : state.startDist;
    baseline = (sd!==null && sd!==undefined) ? sd : null;
  }
  if(baseline===null) return null;
  const d = cur.dist - baseline;
  return d>=0 ? d : null;
}
function totalLegDist(sortedEntries, startDist){
  let sum = 0;
  sortedEntries.forEach((e,i)=>{ const l = legDist(sortedEntries, i, startDist); if(l!==null) sum += l; });
  return sum;
}

function computeCumulative(){
  const list = state.entries;
  const billable = list.filter(isBillable);
  const fareable = list.filter(isFareable);
  const count = dedupeByTime(billable).length;
  const total = list.reduce((s,e)=>s+netFare(e),0); // 運賃(全記録)
  const billableTotal = fareable.reduce((s,e)=>s+netFare(e),0); // 組単価・時間単価の元になる合計(障割は運賃に加算・組数には含めない)
  const pureTotal = list.filter(e=>!SPECIAL_PAYS.includes(e.pay)).reduce((s,e)=>s+netFare(e),0);
  const cashTotal = list.filter(e=>e.pay==='現金').reduce((s,e)=>s+cashReceived(e),0);
  const tollTotal = list.reduce((s,e)=>s+(e.toll||0),0);
  const feeTotal = list.reduce((s,e)=>s+(e.fee||0),0);
  const tollFee = tollTotal + feeTotal;
  const dist = totalLegDist([...list].sort((a,b)=>a.time-b.time));
  return {count, total, billableTotal, pureTotal, cashTotal, tollFee, tollTotal, feeTotal, dist};
}

function statsAt(entriesList){
  const billable = entriesList.filter(isBillable);
  const fareable = entriesList.filter(isFareable);
  const count = dedupeByTime(billable).length;
  const total = fareable.reduce((s,e)=>s+netFare(e),0);
  const lastTime = entriesList.length ? entriesList[entriesList.length-1].time : state.depTime;
  const elapsed = Math.max(lastTime - state.depTime, 0.0167);
  return {
    count, total, elapsed,
    hourly: total/elapsed,
    unit: count ? total/count : 0
  };
}

function computeSections(entries, depTime, startDist){
  const sorted = [...entries].sort((a,b)=>a.time-b.time);
  const legMap = new Map();
  sorted.forEach((e,i)=>{ legMap.set(e.id, legDist(sorted, i, startDist)); });
  let sectionRows = [];
  for(let s=0;s<5;s++){
    const inSectionAll = entries.filter(e => sectionIndexOf(e.time)===s);
    const inSection = inSectionAll.filter(isBillable);
    const inSectionFareable = inSectionAll.filter(isFareable);
    const secCount = dedupeByTime(inSection).length;
    const secTotal = inSectionFareable.reduce((a,e)=>a+netFare(e),0);
    const sectionStart = s===0 ? depTime : CUTOFFS[s-1];
    let secElapsed;
    if(inSectionFareable.length===0){ secElapsed = 0; }
    else{
      const effectiveStart = Math.max(sectionStart, s===0?depTime:CUTOFFS[s-1]);
      const lastInSec = inSectionFareable[inSectionFareable.length-1].time;
      secElapsed = Math.max(lastInSec - effectiveStart, 0.0167);
    }
    let actualSum = 0, legSum = 0;
    inSectionAll.forEach(e=>{
      if(e.actualDist==null) return;
      const leg = legMap.get(e.id);
      if(leg===null || leg===undefined || leg<=0) return;
      // 実車距離の入力誤差(実車距離>区間走行距離)は1件ごとにcapしてから合算する。
      // 合算後にcapすると、1件の誤差が帯全体の実車率を不自然に押し上げてしまうため。
      actualSum += Math.min(e.actualDist, leg); legSum += leg;
    });
    sectionRows.push({
      label: SECTION_LABELS[s],
      secCount, secTotal,
      secUnit: secCount? secTotal/secCount : null,
      secHourly: secCount? secTotal/secElapsed : null,
      secActualRate: legSum>0 ? Math.min(actualSum/legSum*100, 100) : null,
      secLegKm: legSum>0 ? legSum : null,
      secActualKm: legSum>0 ? actualSum : null,
      secElapsed,
      hasData: secCount>0
    });
  }
  return sectionRows;
}

const DIST_BIN_KM = 25;
const DIST_BIN_KM_SUMMARY = 50;
function computeDistanceBins(entries, depTime, binSize, startDist){
  binSize = binSize || DIST_BIN_KM;
  const sorted = [...entries].sort((a,b)=>a.time-b.time);
  let cum = 0;
  const withCum = sorted.map((e,i)=>{
    const leg = legDist(sorted, i, startDist);
    if(leg!==null) cum += leg;
    return Object.assign({}, e, { cumDist: cum, leg });
  });
  if(!withCum.length) return [];
  // ビンの上限は「最後の運賃対象乗車」ではなく、その日の総走行距離(withCumの最終値)を基準にする。
  // 最後の乗車後の回送・帰庫距離やキャンセル後の距離も含めないと、実際に走った距離が
  // ビンの範囲外として消えてしまう(=250km以上走っているのに帯が出ない、という不具合の原因)。
  const maxCum = withCum[withCum.length-1].cumDist;
  const billable = withCum.filter(isBillable);
  const fareable = withCum.filter(isFareable);
  const binCount = Math.max(1, Math.ceil(maxCum / binSize));
  const rows = [];
  let prevTime = depTime;
  for(let b=0; b<binCount; b++){
    const lo = b*binSize, hi = (b+1)*binSize;
    const inBin = billable.filter(e => (b===0 ? e.cumDist>=lo : e.cumDist>lo) && e.cumDist<=hi);
    const inBinFareable = fareable.filter(e => (b===0 ? e.cumDist>=lo : e.cumDist>lo) && e.cumDist<=hi);
    const anyInRange = withCum.filter(e => (b===0 ? e.cumDist>=lo : e.cumDist>lo) && e.cumDist<=hi);
    // 運賃対象の乗車が無くても、その距離帯を実際に走っていれば行として残す(0組でも表示)。
    if(!inBin.length && !anyInRange.length) continue;
    const count = dedupeByTime(inBin).length;
    const total = inBinFareable.reduce((s,e)=>s+netFare(e),0);
    const lastTime = anyInRange.length ? anyInRange[anyInRange.length-1].time : prevTime;
    const elapsed = Math.max(lastTime - prevTime, 0.0167);
    let actualSum = 0, legSum = 0;
    inBin.forEach(e=>{
      if(e.actualDist==null) return;
      if(e.leg===null || e.leg<=0) return;
      // 入力誤差(実車距離>区間走行距離)は1件ごとにcapしてから合算(帯全体を押し上げないため)。
      actualSum += Math.min(e.actualDist, e.leg); legSum += e.leg;
    });
    rows.push({
      label: `${lo}〜${hi}km`,
      count, total,
      unit: count? total/count : 0,
      hourly: total/elapsed,
      actualRate: legSum>0 ? Math.min(actualSum/legSum*100, 100) : null,
      legKm: legSum>0 ? legSum : null,
      actualKm: legSum>0 ? actualSum : null,
      elapsed
    });
    prevTime = lastTime;
  }
  return rows;
}

function computeTypeBreakdown(entries){
  const billable = entries.filter(isBillable);
  const fareable = entries.filter(isFareable);
  return TYPES.map(t=>{
    const list = billable.filter(e=>(e.type||'連配GO')===t);
    const fareList = fareable.filter(e=>(e.type||'連配GO')===t);
    const cnt = dedupeByTime(list).length;
    const sum = fareList.reduce((s,e)=>s+netFare(e),0);
    return { type:t, count:cnt, total:sum, unit: cnt? sum/cnt : 0 };
  }).filter(r=>r.count>0 || r.total!==0);
}

function findPreviousRank(beforeDate){
  const dates = listShiftDates().filter(d=>d<beforeDate).sort().reverse();
  for(const d of dates){
    const st = loadShiftByDate(d);
    if(st && st.goRank && st.goRank.rank!=null){
      return { date:d, rank:st.goRank.rank, total:st.goRank.total };
    }
  }
  return null;
}

function goInfoLine(st, showRenpai){
  if(showRenpai===undefined) showRenpai = true;

  const line3 = [];
  if(st.goRank && st.goRank.rank!=null){
    const totalPart = st.goRank.total!=null ? `<span class="nb">${fmtNum(st.goRank.total)}</span>人中` : '(総人数未反映)';

    if(prev){

      if(diff>0) line1.push(`<span style="color:var(--green);">▲<span class="nb">${fmtNum(diff)}</span>(${fmtDateLabel(prev.date)}比)</span>`);
      else if(diff<0) line1.push(`<span style="color:var(--red);">▼<span class="nb">${fmtNum(Math.abs(diff))}</span>(${fmtDateLabel(prev.date)}比)</span>`);
      else line1.push(`<span style="color:var(--muted);">→変わらず(${fmtDateLabel(prev.date)}比)</span>`);
    }

    if(st.goRank.acceptRate!=null) line2.push(`了解率 <span class="nb">${st.goRank.acceptRate}%</span>`);

  }

    line3.push(`天気 ${st.weather}`);

  const rows = [];

  if(line1.length) rows.push(gi(line1));
  if(line2.length) rows.push(gi(line2));
  if(line3.length) rows.push(gi(line3));
  return `<div class="go-info-line" style="text-align:center;font-size:10.5px;color:var(--muted);margin:-2px 0 8px;">${rows.join('<br>')}</div>`;
}

  const lastTime = entries.length ? entries[entries.length-1].time : state.depTime;

  const achievedM = curTarget>0 ? billableTotal/curTarget*100 : null;

  const achievedDistM = curDistTarget>0 ? billableTotal/curDistTarget*100 : null;

  const distBinTotalHTML = distBinRows.length ? totalRowHTML_dist(distBinRows, hourlyRate, arM?arM.rate:null, dist) : '';

let kpOpen = false;
// タップ即応答用ヘルパー。touchstartで即時発火させ(300ms遅延・取りこぼし対策)、
// 後続のclickは無視することでタッチ環境での二重発火を防ぐ。マウス操作時はclickのみで動作。
function bindTap(el, handler){
  let firedByTouch = false;
  el.addEventListener('touchstart', (e)=>{
    e.preventDefault();
    firedByTouch = true;
    handler(e);
  }, {passive:false});
  el.addEventListener('click', (e)=>{
    if(firedByTouch){ firedByTouch = false; return; }
    handler(e);
  });
}
function openTimeKeypad(inputId, nextFocusId, nextOpener){
  if(kpOpen) return;
  kpOpen = true;
  const input = document.getElementById(inputId || 'timeInput');
  input.blur();
  let val = (input.value || '').toString().replace(/\D/g,'').slice(0,4);

  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="kp-box">
      <div class="kp-title">降車時刻</div>
      <div class="kp-display" id="kpDisplay3">${val || '0'}</div>
      <div class="kp-grid">
        <div class="kp-key" data-k="1">1</div><div class="kp-key" data-k="2">2</div><div class="kp-key" data-k="3">3</div>
        <div class="kp-key" data-k="4">4</div><div class="kp-key" data-k="5">5</div><div class="kp-key" data-k="6">6</div>
        <div class="kp-key" data-k="7">7</div><div class="kp-key" data-k="8">8</div><div class="kp-key" data-k="9">9</div>
        <div class="kp-key kp-func" data-k="now">現在時刻</div><div class="kp-key" data-k="0">0</div><div class="kp-key kp-func" data-k="back">⌫</div>
      </div>
      <div class="kp-actions">
        <button class="kp-cancel" id="kpCancel3">キャンセル</button>
        <button class="kp-ok" id="kpOk3">確定</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const display = overlay.querySelector('#kpDisplay3');
  const closeKp = ()=>{ overlay.remove(); kpOpen = false; };

  overlay.querySelectorAll('.kp-key').forEach(btn=>{
    bindTap(btn, ()=>{
      const k = btn.dataset.k;
      if(k==='back'){
        val = val.slice(0,-1);
      } else if(k==='now'){
        const n = new Date();
        val = String(n.getHours()).padStart(2,'0') + String(n.getMinutes()).padStart(2,'0');
      } else {
        if(val.length>=4) return;
        val += k;
      }
      display.textContent = val || '0';
    });
  });
  bindTap(overlay.querySelector('#kpCancel3'), closeKp);
  bindTap(overlay.querySelector('#kpOk3'), ()=>{
    input.value = val;
    closeKp();
    if(nextOpener){
      nextOpener();
    } else {
      const nextEl = nextFocusId ? document.getElementById(nextFocusId) : null;
      if(nextEl) nextEl.focus();
    }
  });
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeKp(); });
}

function shiftTotalDist(st){
  const sorted = [...st.entries].sort((a,b)=>a.time-b.time);
  let total = totalLegDist(sorted, st.startDist);
  if(st.endDist!==undefined && st.endDist!==null){
    let lastDist = null;
    for(let j=sorted.length-1; j>=0; j--){
      const d = sorted[j].dist;
      if(d!==null && d!==undefined && d!=='' && d>0){ lastDist = d; break; }
    }
    if(lastDist===null){
      lastDist = (st.startDist!==null && st.startDist!==undefined) ? st.startDist : null;
    }
    if(lastDist!==null){
      const extra = st.endDist - lastDist;
      if(extra>=0) total += extra;
    }
  }
  return total;
}

function shiftActualRate(st){
  // トータルの実車率 = 全案件の実車距離合計 ÷ 出庫〜帰庫の総走行距離。
  // 総走行距離には、迎車距離・実車距離(案件の区間走行距離)に加えて、
  // 最後の乗車〜帰庫までの回送距離(どの案件にも属さない)も含まれる。
  // 単純平均ではなく、距離ベースの正しい比率で算出する。
  const cases = computeCaseActualRates(st.entries, st.startDist);
  const actualSum = cases.reduce((s,c)=> s + (c.actualDist!=null ? c.actualDist : 0), 0);
  const count = cases.filter(c=>c.actualDist!=null).length;
  const totalDist = shiftTotalDist(st);
  if(count===0 || totalDist<=0) return null;
  return { actualSum, legSum: totalDist, rate: Math.min(actualSum/totalDist*100, 100), count };
}

// 案件(乗車)ごとの実車率一覧を、乗車の古い順(降車時刻順)で返す。
// キャンセル・B空転・障割は対象外。leg(区間距離)が取れない/実車距離未入力の案件はrate:nullで返す。
function computeCaseActualRates(entries, startDist){
  const DIST_EXEMPT_PAYS = ['キャンセル','B空転','障割','定額負け'];
  const sorted = [...entries].sort((a,b)=>a.time-b.time).filter(e=>!DIST_EXEMPT_PAYS.includes(e.pay));
  return sorted.map((e,i)=>{
    const leg = legDist(sorted, i, startDist);
    let rate = null;
    if(e.actualDist!=null && leg!==null && leg>0){
      rate = Math.min(e.actualDist/leg*100, 100);
    }
    return {
      id: e.id, time: e.time, fare: netFare(e),
      leg, actualDist: e.actualDist!=null ? e.actualDist : null,
      rate
    };
  });
}


function summarizeShift(st){
  const billable = st.entries.filter(isBillable);
  const fareable = st.entries.filter(isFareable);
  const count = dedupeByTime(billable).length;
  const total = st.entries.reduce((s,e)=>s+netFare(e),0);
  const billableTotal = fareable.reduce((s,e)=>s+netFare(e),0);
  const pureTotal = st.entries.filter(e=>!SPECIAL_PAYS.includes(e.pay)).reduce((s,e)=>s+netFare(e),0);
  const cashTotal = st.entries.filter(e=>e.pay==='現金').reduce((s,e)=>s+cashReceived(e),0);
  const dist = shiftTotalDist(st);
  const lastFareTime = st.entries.length ? st.entries[st.entries.length-1].time : st.depTime;
  const lastTime = (st.returnTime!==null && st.returnTime!==undefined)
    ? Math.max(st.returnTime, lastFareTime)
    : lastFareTime;
  const elapsed = Math.max(lastTime - st.depTime, 0.0167);
  return { count, total, billableTotal, pureTotal, cashTotal, dist, elapsed, hourly: billableTotal/elapsed, unit: count? billableTotal/count : 0, lastTime };
}

const ANALYSIS_ICON = {good:'✅', warn:'⚠️', info:'🩺', trend:'📈'};
function buildAnalysis(s, sectionRows, entries, distBinRows, arObj, cancelInfo, dateStr, weather){
  const items = [];
  const THRESH = 6000;
  const withData = sectionRows.filter(r=>r.hasData);
  const withDistData = (distBinRows||[]).filter(r=>r.count>0);
  const SEASON_PHRASE = {
    1: '正月・初売りの繁忙期で、需要は比較的高めの時期です。',
    2: '一年で最も客足が落ち着きやすいとされる閑散期です。',
    3: '卒業・引っ越しシーズンで、荷物を伴う利用が増えやすい時期です。',
    4: '新生活のスタート期で、歓送迎会需要が見込める時期です。',
    5: 'ゴールデンウィークを含み、行楽需要が高まりやすい時期です。',
    6: '梅雨入りの時期で、天候次第で需要が変動しやすい時期です。',
    7: '夏本番に入り、行楽・観光需要が増える時期です。',
    9: '秋の行楽シーズン入りですが、台風の影響も出やすい時期です。',
    10: '行楽・観光のハイシーズンです。',
    11: '忘年会シーズンに入り、夜間需要が増えやすい時期です。',
    12: '忘年会・クリスマス・年末で、一年で最も繁忙になりやすい時期です。'
  };
  // 8月はお盆前・お盆・お盆明けで需要傾向が大きく変わるため、日付でさらに分岐する
  const AUGUST_PHRASE_BY_DAY = (day) => {
    if(day <= 10){
      return '夏本番かつお盆前の時期で、行楽・観光需要が高まりやすい一方、これからお盆の帰省ラッシュに向けて街の人出が徐々に増える時期です。';
    } else if(day <= 17){
      return 'お盆の時期は、帰省や休業で街の人出自体が減り、需要が落ち着きやすい(厳しくなりやすい)時期とされます。空港利用や行楽の需要が支えになる場合もあります。';
    } else {
      return 'お盆明けの時期で、帰省ラッシュの反動もあり街の人出・需要は徐々に平常に戻りやすい時期です。残暑が続く中、行楽・観光需要も見込めます。';
    }
  };
  const WEATHER_COMMENT = {
    '小雨': '小雨程度だと徒歩・自転車移動を続ける人も多く、配車需要への影響は限定的だった可能性があります。',
    '雨': '雨天はGOの配車依頼が増える傾向があるため、通常より稼ぎやすい条件だった可能性があります。',
    '大雨': '強い雨が続くと配車依頼は大きく増えやすい一方、渋滞や視界不良で運行効率が落ちやすい天候でした。',
    '雨時々止む': '雨が降ったり止んだりする天候は、降っているタイミングでスポット的に配車依頼が増えやすい傾向があります。',
    '雪': '積雪・路面凍結のおそれがある一方、配車需要は高まりやすい天候でした。安全運転を優先しつつ稼働できたかがポイントです。',
    '晴れ/くもり': '天候による大きな追い風・向かい風はなかったと考えられます。',
    'くもりのち雨': '天気が崩れ始めたタイミング以降、配車需要が伸びやすい1日だった可能性があります。',
    '晴れのち雨': '午後から雨に変わったことで、後半にかけて配車需要が伸びやすい1日だった可能性があります。',
    '雨のちくもり': '前半の雨で需要が高まり、後半は天候が落ち着くにつれて需要も平常に戻りやすい展開だった可能性があります。',
    '雨のち晴れ': '前半は雨で需要が高く、後半は晴れて落ち着いた、というムラのある展開だった可能性があります。',
    'ゲリラ豪雨': '突発的な豪雨のタイミングで配車依頼が急増しやすい一方、視界不良・道路冠水など安全面のリスクも高い天候でした。',
    '台風': '荒天による大幅な需要増が期待できる一方、運行自体の安全リスクが高い1日だったと考えられます。',
    '猛暑': '猛暑日は歩く・待つことを避けてタクシー需要が増える傾向があります。'
  };

  {
    const diff = Math.round(s.hourly - THRESH);
    const rel = diff>=0
      ? `基準の¥${fmtYen(THRESH)}/hを¥${fmtYen(Math.abs(diff))}上回りました`
      : `基準の¥${fmtYen(THRESH)}/hに¥${fmtYen(Math.abs(diff))}届きませんでした`;
    items.push({
      head:'総合評価',
      type: diff>=0 ? 'good' : 'warn',
      body:`時間単価は¥${fmtYen(s.hourly)}/hで、<b>${rel}</b>(組数${s.count}組・運賃¥${fmtYen(s.total)})。`
    });
  }

  if(withData.length){
    const best = withData.reduce((a,b)=> b.secHourly>a.secHourly? b:a);
    items.push({
      head:'高評価だった時間帯',
      type:'good',
      body:`<b>${best.label}が¥${fmtYen(best.secHourly)}/h</b>(${best.secCount}組・組単価¥${fmtYen(best.secUnit)})と最も稼げた区間でした。`
    });
  } else {
    items.push({ head:'高評価だった時間帯', type:'info', body:'記録がまだないため判定できません。' });
  }

  if(withData.length>=2){
    const worst = withData.reduce((a,b)=> b.secHourly<a.secHourly? b:a);
    items.push({
      head:'課題',
      type:'warn',
      body:`<b>${worst.label}は¥${fmtYen(worst.secHourly)}/h</b>(${worst.secCount}組)に留まり、他の区間との差が出ました。`
    });
  } else if(withData.length===1){
    const only = withData[0];
    items.push({
      head:'課題',
      type:'warn',
      body:`記録が${only.label}の${only.secCount}組のみで、他の時間帯のデータがまだありません。`
    });
  } else {
    items.push({ head:'課題', type:'info', body:'記録がまだないため判定できません。' });
  }

  if(withDistData.length){
    const bestD = withDistData.reduce((a,b)=> b.hourly>a.hourly? b:a);
    const worstD = withDistData.length>=2 ? withDistData.reduce((a,b)=> b.hourly<a.hourly? b:a) : null;
    let body = `<b>${bestD.label}が¥${fmtYen(bestD.hourly)}/h</b>(${bestD.count}組・組単価¥${fmtYen(bestD.unit)})と最も稼げた距離帯でした。`;
    if(worstD && worstD.label!==bestD.label){
      body += `一方${worstD.label}は¥${fmtYen(worstD.hourly)}/hに留まっています。`;
    }
    items.push({ head:'距離帯別の傾向', type:'trend', body });
  }

  const billableEntries = entries.filter(isBillable);
  const longRides = billableEntries.filter(e=>e.actualDist!=null && e.actualDist>=20);
  if(longRides.length>0){
    const longTotal = longRides.reduce((a,e)=>a+netFare(e),0);
    const share = s.pureTotal>0 ? Math.round(longTotal/s.pureTotal*100) : 0;
    items.push({
      head:'ロング案件の貢献',
      body:`実車20km以上のロングが<b>${longRides.length}本(合計¥${fmtYen(longTotal)}・運賃全体の約${share}%)</b>ありました。ロングが多いほど時間単価は伸びやすい傾向です。`
    });
  } else if(billableEntries.length>0){
    items.push({
      head:'ロング案件の貢献',
      body:`実車20km以上のロングは今回ありませんでした。ロングを1〜2本拾えると時間単価の底上げが期待できます。`
    });
  }

  if(arObj && arObj.rate!=null){
    const rateTxt = arObj.rate.toFixed(1);
    let comment;
    if(arObj.rate>=65) comment = '空車での走行が少なく、効率よく回せています。';
    else if(arObj.rate>=50) comment = '標準的な水準です。付け待ち・乗り場対応の比率次第でさらに伸ばせそうです。';
    else comment = '空車時間(回送・流し)が長めです。付け待ちや乗り場対応を増やすと改善が見込めます。';
    items.push({
      head:'実車率',
      body:`出番全体の実車率は<b>${rateTxt}%</b>でした。${comment}`
    });
  }

  const cGo = cancelInfo ? cancelInfo.go : 0;
  const cMusen = cancelInfo ? cancelInfo.musen : 0;
  if((cGo+cMusen)>0){
    items.push({
      head:'キャンセルの影響',
      body:`<b>GOキャンセル${cGo}件・自社無線キャンセル${cMusen}件</b>でした。キャンセル対応中は運賃が発生しないため、その分だけ時間単価が押し下げられています。`
    });
  }

  if(s.count>0){
    const intervalMin = Math.round((s.elapsed*60)/s.count);
    items.push({
      head:'乗車ペース',
      body:`平均<b>${intervalMin}分に1組</b>のペースで、${fmtHM(s.elapsed)}で${s.count}組でした。`
    });
  } else {
    items.push({ head:'乗車ペース', body:'まだ乗車記録がありません。' });
  }

  const WEEKDAY_COMMENT = {
    0: '日曜は週末の稼働の反動もあり出庫台数が少なくなりやすく他社との競合は緩む一方、日中の移動需要はやや控えめな傾向です。夜は翌週に備えて早じまいの流れも出やすい曜日です。',
    1: '月曜は週末に稼働したドライバーの休みが重なりやすく出庫台数はやや少なめ。朝は通勤需要が中心で、平日の中では比較的落ち着いた出足になりやすい傾向です。',
    2: '火曜は出庫台数・需要とも平日の標準的な水準で、大きな追い風・向かい風は少ない基準的な曜日です。',
    3: '水曜は週の折り返しで出庫台数は平日並み。5日・10日など給料日と重なると夜の飲食街需要が伸びやすい傾向があります。',
    4: '木曜は金曜の稼働に備えて出庫台数がやや少なくなる傾向がある一方、売上自体はこれまでのデータでも高くなりやすい曜日です。',
    5: '金曜は週末に向けて出庫台数が週間で最も多くなりやすく他社との競合が激しくなる一方、飲み会・行楽需要で売上も高くなりやすい曜日です。',
    6: '土曜は出庫台数が減りやすく競合は緩む一方、行楽・イベント需要が乗車機会につながることがあります。'
  };
  if(dateStr){
    const wd = new Date(dateStr+'T00:00:00');
    if(!isNaN(wd.getTime())){
      const holidayName = isJapaneseHoliday(dateStr);
      let wBody;
      if(holidayName){
        wBody = `祝日(${holidayName})にあたり、土日と同様に出庫台数が少なくなりやすい一方、行楽・イベント需要が見込める日でした。`;
      } else {
        wBody = WEEKDAY_COMMENT[wd.getDay()];
      }
      if(wBody){
        const label = holidayName ? `${WEEKDAY_JP[wd.getDay()]}曜日・祝日` : `${WEEKDAY_JP[wd.getDay()]}曜日`;
        items.push({ head:'曜日の傾向', body:`${label}。${wBody}` });
      }
    }
  }

  if(dateStr){
    const m = /^\d{4}-(\d{2})-(\d{2})$/.exec(dateStr);
    if(m){
      const month = parseInt(m[1], 10);
      const day = parseInt(m[2], 10);
      const seasonBody = month === 8 ? AUGUST_PHRASE_BY_DAY(day) : (SEASON_PHRASE[month] || '');
      const stretch = getHolidayStretchInfo(dateStr);
      let body = '';
      if(stretch){
        const posText = stretch.isFirstDay ? `${stretch.name}(${stretch.len}連休)の初日` : (stretch.isLastDay ? `${stretch.name}(${stretch.len}連休)の最終日` : `${stretch.name}(${stretch.len}連休)${stretch.dayIndex}日目`);
        body += `本日は${posText}にあたります。行楽・帰省需要で普段より人の動きが変わりやすい期間です。`;
      }
      body += seasonBody;
      if(weather && WEATHER_COMMENT[weather]){
        body += `天気は${weather}。${WEATHER_COMMENT[weather]}`;
      }
      if(body){
        items.push({ head:'季節・天候の傾向', body });
      }
    }
  } else if(weather && WEATHER_COMMENT[weather]){
    items.push({ head:'天候の傾向', body:`天気は${weather}。${WEATHER_COMMENT[weather]}` });
  }

  return items;
}

function startEditEntry(id){
  const e = state.entries.find(x=>x.id===id);
  if(!e) return;
  editingId = id;
  state.selType = e.type || '連配GO';
  state.selPay = e.pay || 'GOPay';
  state.selThanks = !!e.thanks;
  mainViewMode = 'form'; // 記録一覧からの編集はフォーム画面に切り替えて行う
  render();
  document.getElementById('timeInput').value = fmtTime(e.time);
  document.getElementById('fareInput').value = e.fare;

async function onAdd(){
  pendingElsePayConfirm = false;
  const timeStr = document.getElementById('timeInput').value;
  const fareStr = document.getElementById('fareInput').value;
  const toll = parseFloat(document.getElementById('tollInput').value) || 0;
  const fee = parseFloat(document.getElementById('feeInput').value) || 0;
  const dist = parseFloat(document.getElementById('distInput').value) || 0;
  const t = parseTime(timeStr);
  const fare = parseFloat(fareStr);
  if(t===null){ toast('時刻の形式が正しくありません(例: 1231)'); return; }
  if(t < state.depTime){ toast('出庫時刻より前の時刻です'); return; }
  if(isNaN(fare) || fare<0){ toast('運賃を入力してください'); return; }

  if(editingId){
    const idx = state.entries.findIndex(e=>e.id===editingId);
    if(idx===-1){ editingId = null; toast('対象の記録が見つかりませんでした'); render(); return; }
    const entry = state.entries[idx];
    entry.time = t; entry.fare = fare; entry.toll = toll; entry.fee = fee; entry.dist = dist;
    entry.type = state.selType; entry.pay = state.selPay; entry.thanks = state.selThanks;
    state.entries.sort((a,b)=>a.time-b.time);
    const newIdx = state.entries.findIndex(e=>e.id===editingId);
    const before = statsAt(state.entries.slice(0, newIdx));
    const after = statsAt(state.entries.slice(0, newIdx+1));
    entry.comment = localComment(entry, before, after);
    editingId = null;
    state.selThanks = false;
    await saveState();
    render();
    toast('更新しました');
    focusFirstInput();
    return;
  }

  const id = Date.now()+'-'+Math.random().toString(36).slice(2,7);
  const newEntry = {id, time:t, fare, toll, fee, dist, type:state.selType, pay:state.selPay, thanks:state.selThanks, note:'', comment:null};
  if(state.selPay!=='障割'){   // 地点ボタンの記録を、この記録に取り付ける(障割は別記録なので対象外)
    if(state.evPu) newEntry.pu=state.evPu;
    if(state.evBd) newEntry.bd=state.evBd;
    if(state.evDr) newEntry.dr=state.evDr;
    state.evPu = state.evBd = state.evDr = null;
  }
  state.entries.push(newEntry);
  state.entries.sort((a,b)=>a.time-b.time);

  const idx = state.entries.findIndex(e=>e.id===id);
  const before = statsAt(state.entries.slice(0, idx));
  const after = statsAt(state.entries.slice(0, idx+1));
  newEntry.comment = localComment(newEntry, before, after);

  state.selThanks = false;
  state.selType = '連配GO';
  state.selPay = 'GOPay';
  await saveState();
  render();
  toast('記録しました');
  focusFirstInput();
}

const TIME_PHRASE = ['朝の時間帯','昼前後の時間帯','夕方にかけて','夜の時間帯','深夜帯'];
function pick(id, arr){
  let h = 0;
  for(let i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i)) % 997; }
  return arr[h % arr.length];
}
const RATE_TOP_PHRASES = ['かなりの当たりでした。','効率よく稼げた1本です。','いい流れに乗れています。','この調子を維持したいところです。'];
const RATE_GOOD_PHRASES = ['いいペースでした。','悪くない数字です。','堅実に稼げています。','安定した1本でした。'];
const RATE_OK_PHRASES = ['標準的なペースでした。','まずまずの乗務です。','可もなく不可もなくといったところです。'];
const RATE_LOW_PHRASES = ['時間の割に伸びませんでした。','やや厳しい1本でした。','単価は伸び悩みました。','次に期待したいところです。'];
function localComment(entry, before, after){
  const afterH = Math.round(after.hourly);
  const tp = TIME_PHRASE[sectionIndexOf(entry.time)] || '';
  if(entry.pay==='障割'){
    return `時間単価${afterH}円/h ・ ${pick(entry.id, ['運賃には加算されますが、組数・組単価の計算には含まれません。','運賃合計には加算(組数にはカウントされません)。'])}`;
  }
  if(!isBillable(entry)){
    return `時間単価${afterH}円/h ・ ${pick(entry.id, ['集計対象外の記録です。','件数・単価の計算には含まれません。'])}`;
  }
  const elapsed = Math.max((after.elapsed||0) - (before.elapsed||0), 0.0167);
  const mr = Math.round(netFare(entry)/elapsed);
  let qual;
  if(mr>=8000) qual = pick(entry.id, RATE_TOP_PHRASES);
  else if(mr>=6000) qual = pick(entry.id, RATE_GOOD_PHRASES);
  else if(mr>=4000) qual = pick(entry.id, RATE_OK_PHRASES);
  else qual = pick(entry.id, RATE_LOW_PHRASES);
  const trendDiff = before.count>0 ? (after.hourly - before.hourly) : 0;
  let trend = '';
  if(before.count>0 && Math.abs(trendDiff)>=80){
    trend = trendDiff>0
      ? pick(entry.id+'t', ['出番全体の時間単価も押し上げました。','累計の時間単価が上向きました。'])
      : pick(entry.id+'t', ['出番全体の時間単価はやや下がりました。','累計の時間単価を少し押し下げました。']);
  }
  return `時間単価${afterH}円/h(この乗務¥${mr}/h・${tp}) ${qual}${trend?' '+trend:''}`;
}

async function handleExport(){
  const entries = state.entries;
  if(!entries.length){ toast('記録がありません'); return; }
  const sorted = [...entries].sort((a,b)=>a.time-b.time);
  const returnPart = (state.returnTime!==null&&state.returnTime!==undefined) ? ` 帰庫${fmtTime(state.returnTime)}` : '';
  const hasLoc = sorted.some(e=>e.pu||e.bd||e.dr);   // 迎車・乗車・降車ボタン/後入力の地点が1件でもあれば、3列を足す
  const locAd = o => !o ? '' : (o.ad || (o.la!=null ? '座標'+o.la.toFixed(4)+','+o.lo.toFixed(4) : ''));
  const header = `【${fmtDateLabel(state.shiftDate)||state.shiftDate} 日報データ 出庫${fmtTime(state.depTime)}${returnPart}】\n時刻\t種別\t運賃\t高速代\t手数料\t距離(km)\t支払い\t備考`+(hasLoc?'\t迎車ボタン地\t迎車地\t降車地':'');

  const EXPORT_SKIP = ['キャンセル','定額負け','B空転']; // リストに載せない(運賃として集計しないもの)
  const listEntries = sorted.filter(e=>!EXPORT_SKIP.includes(e.pay));

  // 障割(会社負担分)は同時刻に入力された実際の乗車記録と別行になっているが、
  // 日報上は同一乗車として運賃を合算し、障割の行自体は出さない。
  const mergedExtra = new Map(); // target entry -> 合算する障割分の金額
  const mergedAway = new Set(); // 出力から除外する障割entry
  listEntries.forEach(e=>{
    if(e.pay!=='障割') return;
    const target = listEntries.find(t=>t!==e && t.pay!=='障割' && t.time===e.time && !mergedAway.has(t));
    if(target){
      mergedExtra.set(target, (mergedExtra.get(target)||0) + netFare(e));
      mergedAway.add(e);
    }
  });
  const finalEntries = listEntries.filter(e=>!mergedAway.has(e));
  const displayFare = e => netFare(e) + (mergedExtra.get(e)||0);

  const rows = finalEntries.map(e =>
    [fmtTime(e.time), e.type||'', displayFare(e), e.toll||0, e.fee||0, e.dist||0, e.pay||'', [e.note, e.thanks?'サンキュー消費':''].filter(Boolean).join(' ')].concat(hasLoc?[locAd(e.pu), locAd(e.bd), locAd(e.dr)]:[]).join('\t')
  );
  const countForFooter = dedupeByTime(finalEntries.filter(e=>e.pay!=='障割')).length; // 障割は運賃に合算するが組数には数えない(合算できず単独で残った場合のみここで除外)。チケット/現金分割等、同時刻の複数記録も同一案件として1件で数える
  const total = finalEntries.reduce((s,e)=>s+displayFare(e),0);
  const toll = finalEntries.reduce((s,e)=>s+(e.toll||0),0);
  const fee = finalEntries.reduce((s,e)=>s+(e.fee||0),0);
  const dist = totalLegDist(sorted); // 走行距離合計は実際の走行分(全記録の連鎖から算出)
  const footer = `\n合計\t${countForFooter}件\t¥${total}\t¥${toll}\t¥${fee}\t${dist.toFixed(1)}km`;
  const text = [header, ...rows, footer].join('\n');
  try{
    await navigator.clipboard.writeText(text);
    toast('コピーしました。チャットに貼り付けてください');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.left='0'; ta.style.top='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('コピーしました');
  }
}

/* ---------- 走行軌跡(GPS記録・地図表示) ----------
   保存: localStorage 'andon-meter:track:YYYY-MM-DD'(出番キー shift: とは別プレフィックス)
   形式: {v:1,a:[Δ緯度×1e5, Δ経度×1e5, Δ秒, ...]} の差分整数列(1点≒10バイト)
   地図: 国土地理院「淡色地図」タイルを自前canvasで描画(外部ライブラリ不要・タイルが無くても軌跡だけ表示) */
const TRACK_PREFIX = LS_PREFIX+'track:';
const TRACK_ON_KEY = LS_PREFIX+'track-enabled';   // '0' で記録を停止(既定は記録する)
const TRACK_WAKE_KEY = LS_PREFIX+'track-wake';    // '0' で画面点灯維持を無効(既定は点灯維持)
const TRACK_MIN_MOVE_M = 15;     // これ未満の移動は記録しない(停車中の点の増殖防止)
const TRACK_MAX_ACC_M = 100;      // 測位精度がこれより悪い点は捨てる
const TRACK_MAX_SPEED = 70;      // m/s(約250km/h)超の飛びは誤測位として捨てる
const TRACK_GAP_SEC = 180;       // これ以上点が空いた区間は実線で繋がず破線で結ぶ
const TRACK_SAVE_MS = 20000;     // 保存間隔(書き込み頻度を抑える)
let trackPts = [];               // [{la,lo,t}] la/lo=度, t=unix秒
let trackDate = null;
let trackWatchId = null;
let trackDirty = false;
let trackLastSave = 0;
let trackStatus = 'off';         // off | wait | rec | denied | err
let trackWakeLock = null;
let trackMode = 'hi'; // 測位モード: hi=高精度(GPS優先) / std=標準。精度不足が続くと自動で切り替える
let trackDiag = {recv:0, rejAcc:0, lastFix:null, sw:0, lastRecvMs:0, goodMs:0, modeSince:0};
let trackPollId = null, trackDogId = null;
// ===== Androidアプリ版(Capacitor)では、背景でも動く測位プラグインを使う =====
const NATIVE_BG = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform==='function' && window.Capacitor.isNativePlatform());
let trackNativeId = null, nativeBGPlugin = null, nativeLNPlugin = null;
function nativeReg(){
  // アプリ版は capacitor.js(Capacitorの本体)を読み込んで初めて registerPlugin が使える
  const C=window.Capacitor, E=window.capacitorExports;
  if(C && typeof C.registerPlugin==='function') return C.registerPlugin.bind(C);
  if(E && typeof E.registerPlugin==='function') return E.registerPlugin;
  throw new Error('registerPluginが見つかりません(capacitor.js未読込)');
}
function nativeBG(){ if(!nativeBGPlugin) nativeBGPlugin = nativeReg()('BackgroundGeolocation'); return nativeBGPlugin; }
function nativeLN(){ if(!nativeLNPlugin) nativeLNPlugin = nativeReg()('LocalNotifications'); return nativeLNPlugin; }
const TRACK_MODES = ['hi','std','poll'];
const TRACK_MODE_NAME = {hi:'高精度', std:'標準', poll:'定期取得'}; // 診断用: 受信回数・精度不足で除外した回数・直近の測位(採用/除外問わず)

function trackEnabled(){ try{ return localStorage.getItem(TRACK_ON_KEY)!=='0'; }catch(e){ return true; } }
function trackWakeEnabled(){ try{ return localStorage.getItem(TRACK_WAKE_KEY)!=='0'; }catch(e){ return true; } }
function trackEncode(pts){
  const a=[]; let pl=0,po=0,pt=0;
  for(const p of pts){
    const la=Math.round(p.la*1e5), lo=Math.round(p.lo*1e5);
    a.push(la-pl, lo-po, p.t-pt); pl=la; po=lo; pt=p.t;
  }
  return JSON.stringify({v:1,a});
}
function trackDecode(raw){
  try{
    const a=(JSON.parse(raw)||{}).a||[]; const pts=[]; let la=0,lo=0,t=0;
    for(let i=0;i+2<a.length;i+=3){ la+=a[i]; lo+=a[i+1]; t+=a[i+2]; pts.push({la:la/1e5, lo:lo/1e5, t}); }
    return pts;
  }catch(e){ return []; }
}
function trackLoad(date){
  try{ const raw=localStorage.getItem(TRACK_PREFIX+date); return raw?trackDecode(raw):[]; }catch(e){ return []; }
}
function hasTrack(date){ try{ return !!localStorage.getItem(TRACK_PREFIX+date); }catch(e){ return false; } }
function listTrackDates(){
  const out=[];
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf(TRACK_PREFIX)===0) out.push(k.slice(TRACK_PREFIX.length)); } }catch(e){}
  return out.sort().reverse();
}
function trackSave(force){
  if(!trackDate || !trackDirty) return;
  const now=Date.now();
  if(!force && now-trackLastSave<TRACK_SAVE_MS) return;
  try{ localStorage.setItem(TRACK_PREFIX+trackDate, trackEncode(trackPts)); trackDirty=false; trackLastSave=now; }
  catch(e){ if(!trackSave._warned){ trackSave._warned=true; toast('軌跡を保存できません(容量不足?)'); } }
}
function trackDelete(date){
  try{ localStorage.removeItem(TRACK_PREFIX+date); }catch(e){}
  if(trackDate===date){ trackPts=[]; trackDirty=false; }
}
function trackDistM(a,b){
  const r=Math.PI/180, dla=(b.la-a.la)*r, dlo=(b.lo-a.lo)*r;
  const x=Math.sin(dla/2)**2+Math.cos(a.la*r)*Math.cos(b.la*r)*Math.sin(dlo/2)**2;
  return 12742000*Math.asin(Math.sqrt(x));
}
function trackStats(pts){
  let m=0;
  for(let i=1;i<pts.length;i++){ if(pts[i].t-pts[i-1].t<=TRACK_GAP_SEC) m+=trackDistM(pts[i-1],pts[i]); }
  return {n:pts.length, km:m/1000, t0:pts.length?pts[0].t:null, t1:pts.length?pts[pts.length-1].t:null};
}
function trackHM(sec){
  const d=new Date(sec*1000);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function trackOnPos(pos){
  const c=pos.coords;
  trackStatus='rec';
  trackDiag.recv++; trackDiag.lastRecvMs=Date.now(); trackDiag.lastFix={la:c.latitude, lo:c.longitude, acc:c.accuracy, t:Math.round(pos.timestamp/1000)};
  if(c.accuracy>TRACK_MAX_ACC_M){ trackDiag.rejAcc++; updateTrackBtn(); trackLiveUpdate(); return; }
  trackDiag.goodMs=Date.now();
  const t=Math.round(pos.timestamp/1000);
  const p={la:c.latitude, lo:c.longitude, t};
  const last=trackPts[trackPts.length-1];
  if(last){
    const d=trackDistM(last,p), dt=Math.max(t-last.t,1);
    if(d<TRACK_MIN_MOVE_M){ updateTrackBtn(); trackLiveUpdate(); return; }
    if(dt<TRACK_GAP_SEC && d/dt>TRACK_MAX_SPEED) return;
  }
  trackPts.push(p); trackDirty=true;
  trackSave(false); updateTrackBtn(); trackLiveUpdate();
}
// ビューアを開いている間は、測位のたびに途中経過(現在地・点数・走行距離)を更新する
function trackLiveUpdate(){
  if(!tm || !tm.live) return;
  tmRefreshInfo();
  if(!tm.userMoved) tmFit();
  tmRequest();
}
let nativeTries = 0, nativeErrText = '', nativeRetryId = null;
function trackStartNative(){
  diagLog('start');
  trackWatchId=-2; trackStatus='wait'; trackDiag.modeSince=Date.now();
  nativeTries=0; nativeErrText='';
  trackNativeAttempt(true);
  updateTrackBtn();
}
// 起動直後は、背景測位の部品がまだ準備中で "Service not running" になることがあるので、成功するまで繰り返す
async function trackNativeAttempt(first){
  if(trackWatchId===null) return;
  nativeTries++;
  if(first){ try{ await nativeLN().requestPermissions(); }catch(e){} }   // Android 13以降は、通知の許可がないと「記録中」の表示が出ない
  if(trackWatchId===null) return;
  const retry=(ms)=>{ if(nativeRetryId) clearTimeout(nativeRetryId); nativeRetryId=setTimeout(()=>{ nativeRetryId=null; trackNativeAttempt(false); }, ms); };
  try{
    const id = await nativeBG().addWatcher({
      backgroundTitle:'TAXI OPS 走行軌跡を記録中',
      backgroundMessage:'出番の走行軌跡を記録しています',
      requestPermissions:true, stale:false, distanceFilter:5
    }, (loc, err)=>{
      if(err){
        nativeErrText=((err.code?err.code+': ':'')+(err.message||'不明なエラー')); diagLog('err',nativeErrText);
        if(err.code==='NOT_AUTHORIZED'){ trackStatus='denied'; }
        else { trackStatus='wait'; if(trackWatchId!==null && nativeTries<60) retry(2000); else trackStatus='err'; }
        updateTrackBtn(); if(tm) tmRefreshInfo(); return;
      }
      if(!loc) return;
      nativeErrText='';
      trackOnPos({coords:{latitude:loc.latitude, longitude:loc.longitude, accuracy:loc.accuracy}, timestamp:(loc.time||Date.now())});
    });
    if(trackWatchId===null){ try{ nativeBG().removeWatcher({id}); }catch(e){} }   // 登録中に停止された場合
    else trackNativeId=id;
  }catch(e){
    nativeErrText='例外: '+(e && e.message ? e.message : e);
    if(trackWatchId!==null && nativeTries<60) retry(2000); else { trackStatus='err'; updateTrackBtn(); }
    if(tm) tmRefreshInfo();
  }
}
function trackStartWatch(){
  if(trackWatchId!==null) return;
  if(NATIVE_BG){ trackStartNative(); return; }
  if(!navigator.geolocation){ trackStatus='err'; updateTrackBtn(); return; }
  trackStatus='wait';
  trackDiag.modeSince=Date.now();
  const onErr=(err)=>{ trackStatus=(err && err.code===1)?'denied':'err'; updateTrackBtn(); };
  if(trackMode==='poll'){
    // 定期取得: watchせず、5秒ごとに毎回新しく測位を要求する
    trackWatchId=-1;
    const poll=()=>{ try{ navigator.geolocation.getCurrentPosition(trackOnPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:15000}); }catch(e){} };
    poll(); trackPollId=setInterval(poll,5000);
  } else {
    trackWatchId=navigator.geolocation.watchPosition(trackOnPos, onErr, {enableHighAccuracy:(trackMode==='hi'), maximumAge:0, timeout:30000});
  }
  // 見張り: 20秒たっても良い精度の測位が来なければ、測位方法を自動で次に切り替える
  if(!trackDogId) trackDogId=setInterval(()=>{
    if(trackWatchId===null) return;
    const base=Math.max(trackDiag.goodMs,trackDiag.modeSince);
    if(Date.now()-base>20000){ trackNextMode(); }
  },5000);
  trackAcquireWake();
  updateTrackBtn();
}
function trackClearWatch(){
  if(nativeRetryId){ clearTimeout(nativeRetryId); nativeRetryId=null; }
  if(trackNativeId!==null){ const id=trackNativeId; trackNativeId=null; try{ nativeBG().removeWatcher({id}); }catch(e){} }
  if(trackWatchId!==null && trackWatchId>=0){ try{ navigator.geolocation.clearWatch(trackWatchId); }catch(e){} }
  trackWatchId=null;
  if(trackPollId){ clearInterval(trackPollId); trackPollId=null; }
}
function trackRestartWatch(){ trackClearWatch(); trackStartWatch(); }
function trackNextMode(){
  trackDiag.sw++; trackMode=TRACK_MODES[(TRACK_MODES.indexOf(trackMode)+1)%TRACK_MODES.length];
  trackRestartWatch(); if(tm) tmRefreshInfo();
}
function trackStopWatch(){
  trackClearWatch(); if(trackDogId){ clearInterval(trackDogId); trackDogId=null; }
  trackSave(true); trackReleaseWake(); trackStatus='off'; updateTrackBtn();
}
async function trackAcquireWake(){
  try{
    if(!trackWakeEnabled() || !('wakeLock' in navigator) || trackWakeLock) return;
    const wl=await navigator.wakeLock.request('screen');
    trackWakeLock=wl; wl.addEventListener('release',()=>{ if(trackWakeLock===wl) trackWakeLock=null; });
  }catch(e){ trackWakeLock=null; }
}
function trackReleaseWake(){ try{ if(trackWakeLock) trackWakeLock.release(); }catch(e){} trackWakeLock=null; }

// 出庫済みで帰庫時刻が未入力の出番だけ記録する(出番日基準で26時間を超えた放置出番は記録しない)
function trackShouldRun(){
  return !!(state && state.depTime!==null && state.depTime!==undefined && state.shiftDate
    && (state.returnTime===null || state.returnTime===undefined)
    && depElapsedMin(state.depTime) < 26*60);
}
function syncTracking(){
  if(trackShouldRun() && trackEnabled()){
    if(trackDate!==state.shiftDate){
      trackStopWatch();
      trackDate=state.shiftDate; trackPts=trackLoad(trackDate); trackDirty=false;
    }
    trackStartWatch();
  } else if(trackWatchId!==null){
    trackStopWatch();
  } else { updateTrackBtn(); }
}
function updateTrackBtn(){
  const b=document.getElementById('trackBtn'); if(!b) return;
  const col = trackStatus==='rec' ? 'var(--green)' : trackStatus==='wait' ? '#e0a526'
            : (trackStatus==='denied'||trackStatus==='err') ? 'var(--red)' : 'var(--muted2)';
  const dot = '<span style="color:'+col+';font-size:8px;margin-left:1px;vertical-align:top;">●</span>';

document.addEventListener('visibilitychange', ()=>{

  // 画面復帰時は測位が止まっていることがあるので張り直す

/* ---- 軌跡ビューア(全画面オーバーレイ) ---- */
let tm = null; // ビューア状態
// ===== GPSログアプリ(GPSLogger等)のGPXを取り込んで軌跡の抜けを補う =====
// 取り込む時間帯: 現在の出番の日付なら 出庫(10分前)〜帰庫(未入力なら出庫+20.5h、+30分)。それ以外の日付は 当日05:00〜翌05:00。
function trackImportWindow(date){
  const base=new Date(date+'T00:00:00').getTime()/1000;
  let s=base+5*3600, e=base+29*3600;
  if(typeof state!=='undefined' && state && state.shiftDate===date && state.depTime!=null){
    s=base+state.depTime*3600-600;
    const end=(state.returnTime!=null)?state.returnTime:(state.depTime+20.5);
    e=base+end*3600+1800;
  }
  return {s,e};
}
function trackParseGpx(text){
  let doc; try{ doc=new DOMParser().parseFromString(text,'application/xml'); }catch(e){ return null; }
  if(!doc || doc.getElementsByTagName('parsererror').length) return null;
  const out=[]; const els=doc.getElementsByTagName('trkpt');
  for(let i=0;i<els.length;i++){
    const el=els[i];
    const la=parseFloat(el.getAttribute('lat')), lo=parseFloat(el.getAttribute('lon'));
    const te=el.getElementsByTagName('time')[0];
    if(!te || !isFinite(la) || !isFinite(lo)) continue;
    const t=Math.round(Date.parse(te.textContent.trim())/1000);
    if(isFinite(t)) out.push({la,lo,t});
  }
  return out;
}
function trackMergeImport(date, imported){
  const w=trackImportWindow(date);
  const cur=(date===trackDate)?trackPts:trackLoad(date);
  const cand=imported.filter(p=>p.t>=w.s && p.t<=w.e).sort((a,b)=>a.t-b.t);
  // 1) 取込側だけで間引く(同じファイルを何度取り込んでも同じ結果になる)
  const thin=[]; let last=null;
  for(const p of cand){
    if(last){
      const d=trackDistM(last,p), dt=Math.max(p.t-last.t,1);
      if(d<TRACK_MIN_MOVE_M && dt<60) continue;                 // 停車中の点の増殖を防ぐ(60秒ごとには残して、停車を破線にしない)
      if(dt<TRACK_GAP_SEC && d/dt>TRACK_MAX_SPEED) continue;    // 飛びは捨てる
    }
    thin.push(p); last=p;
  }
  // 2) 既存の軌跡に前後60秒以内の点がある所は、既存を優先(=抜けた区間だけ補う)
  const ct=cur.map(p=>p.t).sort((a,b)=>a-b), kept=[]; let j=0;
  for(const p of thin){
    while(j<ct.length && ct[j]<p.t) j++;
    const near=Math.min(j<ct.length?ct[j]-p.t:1e9, j>0?p.t-ct[j-1]:1e9);
    if(near>60) kept.push(p);
  }
  const merged=cur.concat(kept).sort((a,b)=>a.t-b.t);
  if(kept.length){
    if(date===trackDate){ trackPts.splice(0,trackPts.length,...merged); trackDirty=true; trackSave(true); }
    else { try{ localStorage.setItem(TRACK_PREFIX+date, trackEncode(merged)); }catch(e){ return {added:0,inWindow:cand.length,w,err:true,merged:cur}; } }
  }
  return {added:kept.length, inWindow:cand.length, w, merged:(date===trackDate?trackPts:merged)};
}
async function trackImportFiles(files){
  if(!tm || !tm.date){ toast('先に日付を選んでください'); return; }
  let all=[], bad=0;
  for(const f of files){
    let pts=null; try{ pts=trackParseGpx(await f.text()); }catch(e){}
    if(pts===null){ bad++; continue; }
    all=all.concat(pts);
  }
  if(!all.length){ toast(bad?'GPXファイルとして読めませんでした':'位置データが見つかりませんでした'); return; }
  const date=tm.date, r=trackMergeImport(date, all);
  if(r.err){ toast('保存できませんでした(容量不足?)'); return; }
  const hm=sec=>trackHM(sec);
  if(!r.inWindow){ toast('この出番の時間帯('+hm(r.w.s)+'〜'+hm(r.w.e)+')に当たる点がありません'); return; }
  tm.pts=(date===trackDate)?trackPts:r.merged;
  tmFit(); tmRefreshInfo(); tmRequest();
  toast(r.added?('GPSログから'+r.added+'点を追加しました'):'追加できる点はありませんでした(取込済み)');
}

/* ---------- 乗降地(迎車・乗車・降車の時刻と場所)と、軌跡の状態別の色分け ---------- */
const ST_COL={red:'#e5262b', yel:'#f0b400', blue:'#1f78ff', unk:'#8a93a3'}; // 実車=赤 / 迎車=黄 / 空車=青 / 未入力=灰
const MUNI_TXT='13101千代田区,13102中央区,13103港区,13104新宿区,13105文京区,13106台東区,13107墨田区,13108江東区,13109品川区,13110目黒区,13111大田区,13112世田谷区,13113渋谷区,13114中野区,13115杉並区,13116豊島区,13117北区,13118荒川区,13119板橋区,13120練馬区,13121足立区,13122葛飾区,13123江戸川区,13203武蔵野市,13204三鷹市,13208調布市,13219狛江市,13229西東京市,14131川崎市川崎区,14132川崎市幸区,14133川崎市中原区,14134川崎市高津区,14135川崎市多摩区,14136川崎市宮前区,14137川崎市麻生区,14101横浜市鶴見区,14102横浜市神奈川区,14103横浜市西区,14104横浜市中区,14105横浜市南区,14109横浜市港北区,12203市川市,12204船橋市,12227浦安市';
const MUNI={}; MUNI_TXT.split(',').forEach(x=>{ MUNI[x.slice(0,5)]=x.slice(5); });
function evDayStart(date){ return new Date(date+'T00:00:00').getTime()/1000; }
function evPosAt(date,h){            // 軌跡から、その時刻に最も近い位置(前後10分以内)
  const pts=(date===trackDate)?trackPts:trackLoad(date); if(!pts.length) return null;
  const t=evDayStart(date)+h*3600; let lo=0, hi=pts.length-1;
  while(lo<hi){ const m=(lo+hi)>>1; if(pts[m].t<t) lo=m+1; else hi=m; }
  const a=pts[Math.max(0,lo-1)], b=pts[lo], q=(Math.abs(a.t-t)<=Math.abs(b.t-t))?a:b;
  return Math.abs(q.t-t)>600 ? null : {la:q.la, lo:q.lo};
}
async function evGeocode(la,lo){     // 国土地理院の逆ジオコーダー(町丁目まで)。取れなければnull
  try{
    const ac=new AbortController(), tid=setTimeout(()=>ac.abort(),4000);
    const r=await fetch('https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat='+la+'&lon='+lo,{signal:ac.signal});
    clearTimeout(tid);
    const x=(await r.json()).results; if(!x||!x.lv01Nm) return null;
    return (MUNI[String(x.muniCd||'')]||'')+x.lv01Nm;
  }catch(e){ return null; }
}
async function evMk(date,h,old,withT){
  if(h===null||h===undefined) return null;
  const o={}; if(withT) o.t=h;
  const p=evPosAt(date,h);
  if(p){ o.la=p.la; o.lo=p.lo; o.ad=(old&&old.ad&&old.la===p.la&&old.lo===p.lo)?old.ad:await evGeocode(p.la,p.lo); }
  return o;
}
function evPlaceLines(pl){
  return [['pu','迎車'],['bd','乗車'],['dr','降車']].map(([k,n])=>{
    const o=pl[k]; if(!o) return '';
    const t=(o.t!=null)?' '+fmtTime(o.t):'';
    const a=o.ad||(o.la!=null?'住所未取得('+o.la.toFixed(4)+', '+o.lo.toFixed(4)+')':'この時刻の軌跡がありません');
    return '<div><b>'+n+'</b>'+t+' '+a+'</div>';
  }).join('');
}
function evIntervals(date){          // 出番の記録から、状態の区間 [開始秒,終了秒,色] を作る
  const st=(state&&state.shiftDate===date&&state.depTime!==null)?state:loadShiftByDate(date);
  if(!st||!st.entries) return null;
  const by=new Map();
  for(const e of st.entries){ if(e.pay==='障割') continue; const o=by.get(e.time); if(!o||(!(o.bd||o.pu)&&(e.bd||e.pu))) by.set(e.time,e); }
  const base=evDayStart(date), S=h=>base+h*3600, iv=[];
  let prev=(st.depTime!=null)?st.depTime:null;
  for(const e of [...by.values()].sort((a,b)=>a.time-b.time)){
    const pu=(e.pu&&e.pu.t!=null)?e.pu.t:null, bd=(e.bd&&e.bd.t!=null)?e.bd.t:null;
    const cancel=(e.pay==='キャンセル'||e.pay==='B空転');
    if(!cancel && bd!==null){
      const p0=(prev!==null)?prev:bd;
      if(pu!==null && pu>=p0 && pu<=bd){ iv.push([S(p0),S(pu),'blue'],[S(pu),S(bd),'yel']); } else iv.push([S(p0),S(bd),'blue']);
      iv.push([S(bd),S(e.time),'red']);
    } else if(cancel && pu!==null && pu<=e.time){
      iv.push([S(prev!==null?Math.min(prev,pu):pu),S(pu),'blue'],[S(pu),S(e.time),'yel']);
    } else if(prev!==null) iv.push([S(prev),S(e.time),'unk']);
    prev=e.time;
  }
  return {iv:iv.filter(x=>x[1]>x[0]), after:(prev!==null)?S(prev):null};
}
function evColorAt(m,t){             // 時刻tの状態の色キー。記録が無い日は従来どおり赤
  if(!m) return 'red';
  for(const x of m.iv){ if(t>=x[0] && t<x[1]) return x[2]; }
  return (m.after!==null && t>=m.after) ? 'blue' : 'unk';
}

/* ---------- 出動中の地点ボタン(迎車GO・迎車自社・乗車・降車): 押した時刻・位置・住所を記録 ---------- */
const EV_KEY={pu:'evPu', bd:'evBd', dr:'evDr'};
function evNowH(){ return Math.round((Date.now()/1000-evDayStart(state.shiftDate))/3600*60)/60; }
function evNowPos(){        // 直近3分以内の測位(軌跡の記録が動いていればそれを使う)
  const f=trackDiag&&trackDiag.lastFix;
  if(f && Date.now()/1000-f.t<=180) return {la:f.la, lo:f.lo};
  const q=trackPts[trackPts.length-1];
  if(q && trackDate===state.shiftDate && Date.now()/1000-q.t<=180) return {la:q.la, lo:q.lo};
  return null;
}
function evBarInner(){

  const pu=state.evPu, any=state.evPu||state.evBd||state.evDr;

    +mk('bd',null,'乗車','#e5262b',state.evBd)+mk('dr',null,'降車','#1f78ff',state.evDr)
    +(any?'<button class="btn-ghost" onclick="evClear()" style="flex:0 0 44px;min-height:0;height:38px;font-size:11px;padding:0;">取消</button>':'');
}
function evRefreshStat(){ const el=document.getElementById('evBar'); if(el) el.innerHTML=evBarInner(); }
function evBarHTML(){
  if(editingId || !state.shiftDate || state.depTime===null) return '';
  return '<div id="evBar" style="display:flex;gap:5px;margin:0 0 5px;">'+evBarInner()+'</div>';
}
function evClear(){ state.evPu=state.evBd=state.evDr=null; evRefreshStat(); saveState(); }
async function evBtn(k,kind){
  if(!state.shiftDate || state.depTime===null) return;
  const h=evNowH(), pos=evNowPos(), o={t:h};
  if(kind) o.k=kind;
  if(pos){ o.la=pos.la; o.lo=pos.lo; }

  else if(k==='bd'){ state.evBd=o; state.evDr=null; }
  else { state.evDr=o; const ti=document.getElementById('timeInput'); if(ti) ti.value=fmtTime(h); }   // 降車は降車時刻に自動入力

function evKmByState(pts,m){          // 状態別の走行距離(km)。GPS走行の合計と同じく、測位なし区間は含めない
  const r={red:0,yel:0,blue:0,unk:0};
  for(let i=1;i<pts.length;i++){ const a=pts[i-1], b=pts[i]; if(b.t-a.t>TRACK_GAP_SEC) continue; r[evColorAt(m,(a.t+b.t)/2)]+=trackDistM(a,b)/1000; }
  return r;
}

function tmProj(la,lo,z){
  const w=256*Math.pow(2,z), s=Math.sin(la*Math.PI/180);
  return [(lo+180)/360*w, (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*w];
}
function tmTile(tz,tx,ty){
  const key=tz+'/'+tx+'/'+ty;
  let im=tm.tileCache.get(key);
  if(im) return im;
  if(!tm.tiles) return null;
  im=new Image();
  im.crossOrigin='anonymous'; // 画像保存(canvas書き出し)のためCORS付きで取得。拒否された場合は無し再取得(表示のみ可)
  im.onload=()=>tmRequest();
  im.onerror=()=>{
    if(im.crossOrigin){ im.crossOrigin=null; im._tainted=true; im.src=im.src; } else { im._bad=true; }
  };
  im.src='https://cyberjapandata.gsi.go.jp/xyz/pale/'+key+'.png';
  tm.tileCache.set(key, im);
  if(tm.tileCache.size>300){ tm.tileCache.delete(tm.tileCache.keys().next().value); }
  return im;
}
function tmReady(im){ return im && im.complete && im.naturalWidth>0 && !im._bad; }
/* ---------- 走行の再生(1日分を約30秒に縮めて、線を伸ばしながら表示。画面録画で動画にできる) ---------- */
const TM_PLAY_MS = 30000;
function tmPlayBtnUpdate(){
  const b=document.getElementById('tmPlayBtn'); if(!b) return;
  const pl=tm&&tm.play;
  b.textContent = !pl ? '▶' : pl.done ? '↻' : pl.playing ? '⏸' : '▶';
}
function tmPlayToggle(){
  if(!tm) return;
  const pl=tm.play;
  if(pl && !pl.done){                       // 再生中→一時停止 / 停止中→再開
    pl.playing=!pl.playing;
    if(pl.playing){ pl.last=performance.now(); tmPlayLoop(); } else cancelAnimationFrame(pl.raf);
    tmPlayBtnUpdate(); return;
  }
  const pts=tm.pts;
  if(pts.length<2){ toast('再生できる軌跡がありません'); return; }
  const cum=[0];
  for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+((pts[i].t-pts[i-1].t<=TRACK_GAP_SEC)?trackDistM(pts[i-1],pts[i]):0));
  tm.userMoved=false; tmFit();              // 全体が入る範囲に固定して、動画の画角を安定させる
  tm.play={t0:pts[0].t, t1:pts[pts.length-1].t, cum, elapsed:0, last:performance.now(), playing:true, done:false, i:0, n:1, cur:pts[0].t, pos:{la:pts[0].la,lo:pts[0].lo}, km:0, raf:0};
  tmPlayBtnUpdate(); tmPlayLoop();
}
function tmPlayStep(pl){
  const pts=tm.pts, f=Math.min(1, pl.elapsed/TM_PLAY_MS);
  pl.cur=pl.t0+(pl.t1-pl.t0)*f;
  while(pl.i<pts.length-2 && pts[pl.i+1].t<=pl.cur) pl.i++;
  const a=pts[pl.i], b=pts[Math.min(pl.i+1,pts.length-1)];
  const span=Math.max(1,b.t-a.t), u=Math.max(0,Math.min(1,(pl.cur-a.t)/span));
  pl.pos={la:a.la+(b.la-a.la)*u, lo:a.lo+(b.lo-a.lo)*u};
  const seg=(b.t-a.t<=TRACK_GAP_SEC)?trackDistM(a,b):0;
  pl.km=(pl.cum[pl.i]+seg*u)/1000;
  pl.n=(u>=1||f>=1)?pl.i+2:pl.i+1;
  if(f>=1){ pl.done=true; pl.playing=false; pl.n=pts.length; pl.km=pl.cum[pts.length-1]/1000; pl.pos={la:pts[pts.length-1].la,lo:pts[pts.length-1].lo}; }
}
function tmPlayLoop(){

  if(!pl.done) pl.raf=requestAnimationFrame(tmPlayLoop);
}
function tmPlayStop(){ if(tm && tm.play){ cancelAnimationFrame(tm.play.raf); tm.play=null; tmPlayBtnUpdate(); } }
function tmDrawHud(ctx,W,H,pl){
  const dayStart=new Date(tm.date+'T00:00:00').getTime()/1000;
  const hm=(sec)=>{ const m=Math.max(0,Math.floor((sec-dayStart)/60)); return Math.floor(m/60)+':'+String(m%60).padStart(2,'0'); };
  const el=Math.max(0,Math.floor((pl.cur-pl.t0)/60));
  ctx.save();
  ctx.fillStyle='rgba(12,14,20,.72)'; ctx.beginPath(); ctx.roundRect?ctx.roundRect(10,10,168,74,12):ctx.rect(10,10,168,74); ctx.fill();
  ctx.fillStyle='#c9d1e0'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.font='600 11px sans-serif'; ctx.fillText(fmtDateLabel(tm.date)+'  経過 '+Math.floor(el/60)+':'+String(el%60).padStart(2,'0'),20,28);
  ctx.fillStyle='#ffd479'; ctx.font='700 28px monospace'; ctx.fillText(hm(pl.cur),20,58);
  ctx.fillStyle='#fff'; ctx.font='600 13px sans-serif'; ctx.fillText('走行 '+pl.km.toFixed(1)+' km',20,77);
  // 進み具合のバー
  const f=Math.min(1,(pl.cur-pl.t0)/Math.max(1,pl.t1-pl.t0));

}
function tmRequest(){
  if(!tm || tm.raf) return;
  tm.raf=requestAnimationFrame(()=>{ if(tm){ tm.raf=0; tmDraw(); } });
}
function tmFit(){
  const W=tm.W, H=tm.H;
  const pts=tm.pts.slice();
  if(tm.live && trackDiag.lastFix) pts.push(trackDiag.lastFix); // 記録中は現在地も範囲に含める
  if(!pts.length){ tm.z=11; const w=tmProj(35.681,139.767,11); tm.cx=w[0]; tm.cy=w[1]; return; }
  let a=90,b=-90,c=180,d=-180;
  for(const p of pts){ if(p.la<a)a=p.la; if(p.la>b)b=p.la; if(p.lo<c)c=p.lo; if(p.lo>d)d=p.lo; }
  let z=17;
  for(; z>3; z-=0.25){
    const p1=tmProj(b,c,z), p2=tmProj(a,d,z);
    if(Math.abs(p2[0]-p1[0])<=W-70 && Math.abs(p2[1]-p1[1])<=H-70) break;
  }
  if(pts.length===1) z=16;
  tm.z=z;
  const p1=tmProj(b,c,z), p2=tmProj(a,d,z);
  tm.cx=(p1[0]+p2[0])/2; tm.cy=(p1[1]+p2[1])/2;

function tmZoomAt(mx,my,dz){
  tm.userMoved=true;
  const nz=Math.max(3,Math.min(19,tm.z+dz)); const f=Math.pow(2,nz-tm.z);
  const wx=tm.cx-tm.W/2+mx, wy=tm.cy-tm.H/2+my;
  tm.cx=wx*f-mx+tm.W/2; tm.cy=wy*f-my+tm.H/2; tm.z=nz;
  tmRequest();
}
function tmDraw(){
  const cv=tm.cv, ctx=cv.getContext('2d'), W=tm.W, H=tm.H, z=tm.z;
  ctx.setTransform(tm.dpr,0,0,tm.dpr,0,0);
  const cs=getComputedStyle(document.documentElement);
  ctx.fillStyle=(cs.getPropertyValue('--card2')||'#20262f').trim()||'#20262f';
  ctx.fillRect(0,0,W,H);
  const ox=tm.cx-W/2, oy=tm.cy-H/2;
  if(tm.tiles){
    const tz=Math.max(3,Math.min(18,Math.round(z))), k=Math.pow(2,z-tz), ts=256*k, n=Math.pow(2,tz);
    for(let ty=Math.floor(oy/ts); ty<=Math.floor((oy+H)/ts); ty++){
      if(ty<0||ty>=n) continue;
      for(let tx=Math.floor(ox/ts); tx<=Math.floor((ox+W)/ts); tx++){
        if(tx<0||tx>=n) continue;
        const sx=tx*ts-ox, sy=ty*ts-oy, im=tmTile(tz,tx,ty);
        if(tmReady(im)){ ctx.drawImage(im,sx,sy,ts+0.6,ts+0.6); continue; }
        // 未取得のタイルは読み込み済みの親タイルを拡大して仮表示
        const pk=(tz-1)+'/'+(tx>>1)+'/'+(ty>>1), pim=tm.tileCache.get(pk);
        if(tz>3 && tmReady(pim)){
          ctx.drawImage(pim,(tx&1)*128,(ty&1)*128,128,128,sx,sy,ts+0.6,ts+0.6);
        }
      }
    }
  }
  const pl=tm.play;
  const pts=pl?tm.pts.slice(0,pl.n):tm.pts;   // 再生中は、再生位置までの点だけを描く
  const xy=(p)=>{ const w=tmProj(p.la,p.lo,z); return [w[0]-ox, w[1]-oy]; };
  ctx.lineJoin='round'; ctx.lineCap='round';
  if(pts.length>1){
    // 実線(連続測位)は状態の色で、破線(測位が途切れた区間)は同じ色の破線で描く
    const col=(a,b)=>evColorAt(tm.iv,(a.t+b.t)/2);
    ctx.lineWidth=3.5; let runC=null, prev=null, ps=null, gaps=[];
    const flush=()=>{ if(runC){ ctx.strokeStyle=ST_COL[runC]; ctx.stroke(); } };
    ctx.beginPath();
    for(const p of pts){
      const sp=xy(p);
      if(prev){
        if(p.t-prev.t<=TRACK_GAP_SEC){
          const c=col(prev,p);
          if(c!==runC){ flush(); ctx.beginPath(); ctx.moveTo(ps[0],ps[1]); runC=c; }
          ctx.lineTo(sp[0],sp[1]);
        } else { gaps.push([prev,p,ps,sp]); flush(); runC=null; ctx.beginPath(); }
      }
      prev=p; ps=sp;
    }
    flush();
    if(gaps.length){
      ctx.lineWidth=2.5; ctx.setLineDash([6,6]);
      for(const g of gaps){ ctx.strokeStyle=ST_COL[evColorAt(tm.iv,(g[0].t+g[1].t)/2)]; ctx.beginPath(); ctx.moveTo(g[2][0],g[2][1]); ctx.lineTo(g[3][0],g[3][1]); ctx.stroke(); }
      ctx.setLineDash([]);
    }
  }
  if(pts.length){
    const mark=(p,fill,label)=>{
      const s=xy(p); ctx.beginPath(); ctx.arc(s[0],s[1],10,0,Math.PI*2);
      ctx.fillStyle=fill; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(label,s[0],s[1]+0.5);
    };
    mark(pts[0],'#2e9e5b','出');
    if(pts.length>1 && (!pl || pl.done)) mark(pts[pts.length-1], (tm.live&&!pl)?'#2f6fd6':'#555','' + ((tm.live&&!pl)?'今':'終'));
  }
  if(pl && !pl.done){      // 再生中の現在位置(タクシーの点)
    const s=xy(pl.pos);
    ctx.beginPath(); ctx.arc(s[0],s[1],13,0,Math.PI*2); ctx.fillStyle='rgba(232,163,61,.28)'; ctx.fill();
    ctx.beginPath(); ctx.arc(s[0],s[1],8,0,Math.PI*2); ctx.fillStyle='#e8a33d'; ctx.fill(); ctx.lineWidth=2.5; ctx.strokeStyle='#fff'; ctx.stroke();
  }
  if(tm.live && trackDiag.lastFix && !pl){
    // 現在地(青点+精度円)。軌跡の点が0でも、測位できていればここに出る
    const f=trackDiag.lastFix, s=xy(f), mpp=156543.03*Math.cos(f.la*Math.PI/180)/Math.pow(2,z);
    const rr=Math.min(Math.max(f.acc/mpp,0),Math.max(W,H));
    ctx.beginPath(); ctx.arc(s[0],s[1],rr,0,Math.PI*2); ctx.fillStyle='rgba(47,111,214,.15)'; ctx.fill();
    ctx.beginPath(); ctx.arc(s[0],s[1],7,0,Math.PI*2); ctx.fillStyle='#2f6fd6'; ctx.fill(); ctx.lineWidth=2.5; ctx.strokeStyle='#fff'; ctx.stroke();
  }
  if(pl) tmDrawHud(ctx,W,H,pl);
}
function tmInfoText(){
  const s=trackStats(tm.pts);
  const live = tm.live && tm.date===trackDate;
  const f = live ? trackDiag.lastFix : null;
  const accTxt = f ? ' ・ 現在の精度'+Math.round(f.acc)+'m' : '';
  if(!s.n){
    if(!live) return 'この日の軌跡データはありません';
    if(!f) return '記録中 ・ 測位待ち(まだ1回も受信していません)'+(NATIVE_BG?' ['+(nativeErrText||'エラーなし')+' / 試行'+nativeTries+'回]':'');
    return '記録中 ・ 軌跡0点(受信'+trackDiag.recv+'回/精度不足'+trackDiag.rejAcc+'回/モード'+TRACK_MODE_NAME[trackMode]+'・切替'+trackDiag.sw+'回/最終受信'+(trackDiag.lastRecvMs?Math.round((Date.now()-trackDiag.lastRecvMs)/1000)+'秒前':'なし')+')'+accTxt+(f.acc>TRACK_MAX_ACC_M?' ※精度が悪く記録できません(自動で測位方法を切替中)':'');

function tmRefreshInfo(){

function tmExport(){

      if(d0>10 && d1>10) tmZoomAt(m1.x,m1.y,Math.log2(d1/d0)); else tmRequest();
    }
  });
  const up=(e)=>{ tm.pointers.delete(e.pointerId); };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',(e)=>{ e.preventDefault(); tmZoomAt(e.offsetX,e.offsetY,-e.deltaY*0.002); },{passive:false});
  tmSetDate(date||'');
  // 記録中の出番は10秒ごとに自動更新
  tm.timer=setInterval(()=>{ if(!tm) return; tm.live=(tm.date===trackDate && trackWatchId!==null); tmRefreshInfo(); tmRequest(); },10000);
}
function trackButtonRowHTML(btnId){
  return `<div class="summary-actions" style="margin-top:6px;"><button class="btn-ghost" id="${btnId}">🗺 走行軌跡を見る</button></div>`;
}

(async function init(){
  try{
    const savedTheme = localStorage.getItem(LS_PREFIX+'theme');
    if(savedTheme) applyTheme(savedTheme);
    else renderThemePicker();
  }catch(e){ renderThemePicker(); }
  document.getElementById('trackBtn').onclick = ()=>openTrackViewer();
  const resumed = await tryResume();
  render();
  if(resumed){ toast('前回の出番を再開しました'); if(!summaryMode) focusFirstInput(); }
  try{ window.taxiopsBootOk && window.taxiopsBootOk(); }catch(e){}
  diagLog('boot',(window.__TAXIOPS?('build '+window.__TAXIOPS.build):''));
  document.addEventListener('visibilitychange', ()=>{ diagLog(document.hidden?'hid':'vis'); });
  setTimeout(()=>{ taxiopsRunCheck(false); }, 4000);
  if(backupStale()) setTimeout(()=>toast('バックアップが古いです。「⋯」→「全データをコピー」で退避してください'), 2500);
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && Date.now()-(window.__lastUpdateCheck||0) > 3600*1000) taxiopsRunCheck(false);
  });
})();
</script>
