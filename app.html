  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Zen Kaku Gothic New',sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:12px;
    scroll-snap-type:y proximity;
    font-variant-numeric:slashed-zero;
    font-feature-settings:"zero" 1;
  }
  .wrap{max-width:460px;margin:0 auto;padding:1px 9px 0;}
  .meter,.add-card,.section-card,.list-card{scroll-snap-align:start;scroll-margin-top:6px;}

  /* header */
  .header{display:flex;flex-wrap:nowrap;align-items:center;gap:5px;padding:1px 2px 2px;white-space:nowrap;}
  .header>*{flex-shrink:0;}
  .lamp{
    width:12px;height:12px;border-radius:3px;background:var(--amber);
    box-shadow:0 0 10px 2px var(--amber-dim);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  .header h1{font-size:13.5px;font-weight:700;letter-spacing:.08em;margin:0;color:var(--text);white-space:nowrap;}
  .header .sub{font-size:10.5px;color:var(--muted);margin-left:auto;font-family:'PT Mono',monospace;white-space:normal;text-align:right;line-height:1.2;flex-shrink:1;min-width:0;}

  /* setup card */
  .setup-card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:20px 16px;text-align:center;
  }
  .setup-card p{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 14px;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;text-align:left;}
  .field label{font-size:10.5px;color:var(--muted);letter-spacing:.04em;}
  input[type=text],input[type=number],input[type=date],select{
    background:var(--card2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-size:15px;padding:0 9px;font-family:'PT Mono',monospace;
    width:100%;height:37px;box-sizing:border-box;
  }
  input::placeholder{color:var(--muted);}
  select:disabled{opacity:0.45;}
  .btn{
    background:linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0) 50%), var(--amber);
    color:#1b1200;border:none;border-radius:12px;
    font-weight:800;font-size:14px;padding:0 14px;width:100%;height:40px;
    letter-spacing:.03em;display:flex;align-items:center;justify-content:center;
    box-shadow:0 5px 0 rgba(0,0,0,.5), 0 9px 16px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 5px rgba(0,0,0,.18);
    text-shadow:0 1px 0 rgba(255,255,255,.3);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn:active{
    opacity:.96;transform:translateY(5px);
    box-shadow:0 0 0 rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.2), inset 0 2px 4px rgba(0,0,0,.2);
  }
  .btn-ghost{
    background:linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,0) 50%), var(--card2);
    color:var(--muted);border:1px solid var(--border);
    border-radius:11px;font-size:11px;padding:7px 14px;font-weight:600;
    box-shadow:0 4px 0 rgba(0,0,0,.4), 0 7px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 4px rgba(0,0,0,.15);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn-ghost:active{
    transform:translateY(4px);
    box-shadow:0 0 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05), inset 0 2px 3px rgba(0,0,0,.15);
  }
  .resume-note{font-size:10.5px;color:var(--amber);margin:-6px 0 12px;text-align:center;}

  /* meter card */
  .meter{
    background:linear-gradient(180deg,#1c2129,#171b21);
    border:1px solid var(--border);border-radius:13px;
    padding:6px 12px 5px;margin-bottom:4px;
    box-shadow:0 8px 24px -8px rgba(0,0,0,.5);
  }
  .meter-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0px;}
  .meter-label{font-size:9px;color:var(--muted);letter-spacing:.08em;}
  .meter-elapsed{font-size:9px;color:var(--muted);font-family:'PT Mono',monospace;}
  .meter-row3{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
  .meter-col{display:flex;flex-direction:column;flex:1;min-width:0;}
  .meter-col .meter-digit{white-space:nowrap;}
  .meter-digit-plain{color:var(--text)!important;text-shadow:none!important;}
  .meter-digit{
    font-family:'PT Mono',monospace;font-weight:700;font-size:19px;line-height:1.05;
    color:var(--amber);text-shadow:0 0 12px rgba(232,163,61,.3);
    font-variant-numeric:tabular-nums;letter-spacing:-1px;
  }
  .meter-digit.low{color:var(--red);text-shadow:0 0 12px rgba(229,83,61,.3);}
  .meter-digit .unit{font-size:11px;color:var(--muted);margin-left:4px;font-weight:400;}
  .meter-digit-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .meter-digit-row .meter-digit{white-space:nowrap;}
  .meter-target-big.pos{color:var(--green);text-shadow:none;}
  .meter-target-big.neg{color:var(--red);text-shadow:none;}
  .nb{font-weight:700;}
  .meter-target-caption{font-size:8.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meter-sub{display:flex;gap:8px;margin-top:2px;}
  .meter-sub div{flex:1;font-size:10px;color:var(--text);}
  .meter-sub b{display:block;font-family:'PT Mono',monospace;font-size:19px;letter-spacing:-1px;line-height:1.1;color:var(--text);font-weight:700;margin-top:0px;}
  .meter-sub2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px;margin-top:4px;padding-top:4px;border-top:1px solid var(--border);}
  .meter-sub2 div{font-size:9px;color:var(--muted);}
  .meter-sub2 b{display:block;font-family:'PT Mono',monospace;font-size:11.5px;color:var(--text);font-weight:700;margin-top:0px;}

  /* add form */
  .add-card{
    background:var(--card);border:1px solid var(--border);border-radius:11px;
    padding:5px 9px;margin-bottom:5px;
  }
  .add-title{font-size:9px;color:var(--muted);letter-spacing:.06em;margin-bottom:3px;font-weight:500;}
  .add-row{display:flex;gap:6px;}
  .add-row .field{flex:1;margin-bottom:0;gap:2px;}
  .add-row2{margin-top:4px;}

  /* chips */
  .chip-row{display:flex;gap:5px;flex-wrap:nowrap;margin-bottom:4px;}
  .chip{
    flex:1 1 0;min-width:0;text-align:center;padding:0 3px;border-radius:9px;
    border:1px solid var(--border);
    background:linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,0) 50%), var(--card2);
    color:var(--text);
    font-size:12px;font-weight:600;cursor:pointer;user-select:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    height:37px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 0 rgba(0,0,0,.4), 0 6px 10px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 4px rgba(0,0,0,.15);
    transition:transform .08s ease, box-shadow .08s ease;
    margin-bottom:2px;
  }
  .chip:active{
    transform:translateY(4px);
    box-shadow:0 0 0 rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.05), inset 0 2px 3px rgba(0,0,0,.15);
  }
  .chip.active{
    background:linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0) 50%), var(--amber);
    border-color:var(--amber);color:#1b1200;font-weight:800;
    box-shadow:0 4px 0 rgba(0,0,0,.45), 0 6px 10px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -2px 4px rgba(0,0,0,.15);
    text-shadow:0 1px 0 rgba(255,255,255,.3);
  }
  .chip.pay{font-size:11px;}
  /* 現金は他の支払い種別と間違えやすいため、選択前でも常に緑で目立たせる */
  .chip.pay.cash-chip{background:linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,0) 50%), #1d3b25;border-color:#2f6b3f;color:#8fe0a0;}
  .chip.pay.cash-chip.active{background:linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 50%), #2f6b3f;border-color:#4caf60;color:#eafff0;}
  /* 「それ以外」は現金の隣で押し間違えやすいため、1回目のタップでは確定せず確認状態にする */
  .chip.pay.pending-confirm{background:var(--red);border-color:var(--red);color:#fff;animation:pendingPulse 1s ease-in-out infinite;}
  @keyframes pendingPulse{0%,100%{opacity:1;}50%{opacity:.6;}}

  /* section table */
  .section-card{
    background:var(--card);border:1px solid var(--border);border-radius:11px;
    padding:7px 9px;margin-bottom:6px;
  }
  .card-title{font-size:9px;color:var(--muted);letter-spacing:.06em;margin-bottom:4px;font-weight:500;
    display:flex;justify-content:space-between;align-items:center;}
  summary.card-title::-webkit-details-marker{display:none;}
  summary.card-title::marker{content:'';}
  table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:10px;}
  th{color:var(--muted2);font-weight:500;text-align:right;padding:2px 2px;font-size:8.5px;border-bottom:1px solid var(--border);overflow-wrap:break-word;}
  th:first-child,td:first-child{text-align:left;}
  td{text-align:right;padding:3px 2px;font-family:'PT Mono',monospace;border-bottom:1px solid var(--border);overflow-wrap:break-word;word-break:break-word;}
  td.label{font-family:'Zen Kaku Gothic New',sans-serif;color:var(--text);font-size:9.5px;}
  tr:last-child td{border-bottom:none;}
  .dim{color:var(--muted2);}
  .pos{color:var(--green);}
  .neg{color:var(--red);}

  /* entry list */
  .list-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:7px 9px;margin-bottom:6px;}
  .entry-scroll{max-height:160px;overflow-y:auto;}
  .entry-scroll.expanded{max-height:none;}
  .list-toggle{
    font-size:10px;color:var(--amber);font-weight:500;cursor:pointer;
    border:1px solid var(--amber-dim);border-radius:6px;padding:2px 8px;
  }
  .entry{
    padding:6px 0;border-bottom:1px solid var(--border);
  }
  .entry-row-tap{cursor:pointer;}
  .entry-row-tap:active{background:rgba(232,163,61,.06);border-radius:6px;}
  .add-card.editing{border-color:var(--amber);}
  .edit-banner{
    display:flex;justify-content:space-between;align-items:center;
    background:rgba(232,163,61,.1);border:1px solid var(--amber-dim);
    border-radius:7px;padding:5px 9px;margin-bottom:7px;font-size:10.5px;color:var(--amber);
  }
  .edit-banner span{cursor:pointer;color:var(--muted);text-decoration:underline;}
  .entry:last-child{border-bottom:none;}
  .entry-row{display:flex;align-items:center;gap:8px;}
  .entry-no{
    font-family:'PT Mono',monospace;font-size:9px;color:var(--muted2);
    width:16px;flex-shrink:0;
  }
  .entry-time{font-family:'PT Mono',monospace;font-size:11px;color:var(--muted);width:38px;flex-shrink:0;}
  .entry-mid{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry-type{display:inline-block;font-size:9px;padding:1px 5px;border-radius:4px;background:var(--card2);color:var(--amber);margin-right:5px;white-space:nowrap;}
  .entry-pay{font-size:9.5px;color:var(--muted);white-space:nowrap;}
  .entry-fare{font-family:'PT Mono',monospace;font-size:12.5px;font-weight:700;text-align:right;}
  .entry-fare-sub{font-size:8.5px;color:var(--muted2);text-align:right;margin-top:1px;overflow-wrap:break-word;}
  .entry-fare-sub.warn{color:var(--red);font-weight:700;}
  .entry-warn{background:rgba(229,83,61,.08);border-radius:6px;margin:0 -6px;padding-left:6px;padding-right:6px;}
  .entry-del{
    background:none;border:none;color:var(--muted2);font-size:14px;padding:2px 4px;flex-shrink:0;
  }
  .entry-comment{
    margin:4px 0 0 24px;font-size:10.5px;color:var(--text);line-height:1.45;
    background:var(--card2);border-left:3px solid var(--amber-dim);
    padding:7px 8px;border-radius:9px;
  }
  .entry-comment b{color:var(--amber);}
  .entry-live{color:var(--amber);}
  .empty{color:var(--muted2);font-size:11px;text-align:center;padding:12px 0;}

  .footer-row{display:flex;gap:8px;margin-top:2px;}
  /* 出動中画面: 画面の高さいっぱいに使って、上の詰まりと下の余白を解消する */
  .wrap{min-height:calc(100vh - 12px);min-height:calc(100dvh - 12px);box-sizing:border-box;display:flex;flex-direction:column;}
  .header{padding:5px 2px 4px;}
  #mainView{flex:1;flex-direction:column;}
  #mainView>.meter{padding:8px 12px 7px;margin-bottom:5px;}
  #mainView>.meter .meter-sub2{gap:7px 8px;margin-top:6px;padding-top:6px;}
  #mainView>.meter .meter-row3{margin-top:2px;}
  #mainView>.add-card{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:11px 10px;margin-bottom:0;}
  .more-sheet{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.62);z-index:300;display:none;align-items:flex-end;justify-content:center;}
  .more-sheet.open{display:flex;}
  .more-sheet-inner{width:100%;max-width:460px;background:var(--card);border-radius:16px 16px 0 0;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px));max-height:82vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
  .more-sheet-title{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:var(--text);padding:2px 2px 4px;}
  .footer-row .btn-ghost{flex:1;}

  .confirm-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.62);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .confirm-box{
    background:var(--card2);border:1px solid var(--border);border-radius:14px;
    padding:18px 16px;max-width:300px;width:100%;
  }
  .confirm-msg{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:16px;text-align:center;}
  .confirm-actions{display:flex;gap:8px;}
  .confirm-actions button{
    flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:700;border:none;
  }
  .confirm-cancel{background:transparent;border:1px solid var(--border) !important;color:var(--muted);}
  .confirm-ok{background:var(--red);color:#fff;}

  /* distance keypad */
  .kp-box{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px 14px 16px;max-width:300px;width:100%;}
  .kp-title{font-size:11px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:8px;}
  .kp-display{
    font-family:'PT Mono',monospace;font-size:26px;font-weight:700;color:var(--amber);
    text-align:center;background:var(--card);border:1px solid var(--border);border-radius:9px;
    padding:10px;margin-bottom:12px;letter-spacing:1px;
  }
  .kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
  .kp-key{
    background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);
    font-family:'PT Mono',monospace;font-size:18px;font-weight:700;padding:14px 0;text-align:center;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .kp-key:active{background:var(--border);}
  .kp-key.kp-func{color:var(--muted);font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;font-weight:500;}
  .kp-actions{display:flex;gap:8px;}
  .kp-actions button{flex:1;padding:11px;border-radius:9px;font-size:14px;font-weight:700;border:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  .kp-cancel{background:transparent;border:1px solid var(--border) !important;color:var(--muted);}
  .kp-ok{background:var(--amber);color:#1b1200;}

  .summary-full{
    min-height:100vh;padding:6px 12px 16px;
    display:flex;flex-direction:column;
  }
  .summary-full-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;flex-shrink:0;}
  .summary-body-center{flex:1;display:flex;flex-direction:column;justify-content:center;overflow-y:auto;}
  .summary-full-title{font-size:12.5px;font-weight:700;color:var(--text);}
  .summary-close{background:none;border:1px solid var(--border);color:var(--muted);font-size:11px;padding:3px 8px;border-radius:7px;}

  .summary-time{font-size:10.5px;color:var(--muted);text-align:center;margin-bottom:2px;font-family:'PT Mono',monospace;}
  .summary-big{
    font-family:'PT Mono',monospace;font-weight:700;font-size:28px;color:var(--amber);
    text-align:center;margin-bottom:5px;text-shadow:0 0 14px rgba(232,163,61,.3);
    line-height:1.1;
  }
  .summary-big .unit{font-size:13px;color:var(--muted);font-weight:400;}
  .summary-sub{display:flex;justify-content:center;gap:16px;margin-bottom:8px;flex-wrap:wrap;}
  .summary-sub div{font-size:10px;color:var(--muted);text-align:center;}
  .summary-sub b{display:block;font-family:'PT Mono',monospace;font-size:14.5px;line-height:1.15;color:var(--text);margin-top:1px;}
  .summary-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:11px;}
  .summary-table th{color:var(--muted2);font-weight:500;text-align:right;padding:3px 2px;font-size:9.5px;border-bottom:1px solid var(--border);overflow-wrap:normal;word-break:keep-all;white-space:nowrap;}
  .summary-table th:first-child,.summary-table td:first-child{text-align:left;white-space:normal;}
  .summary-table td{text-align:right;padding:4px 2px;font-family:'PT Mono',monospace;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);white-space:nowrap;overflow-wrap:normal;word-break:keep-all;}
  .summary-table td.label{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;color:var(--text);white-space:normal;word-break:normal;overflow-wrap:break-word;}
  .summary-table .pos{color:var(--green);}
  .summary-table .neg{color:var(--red);}
  .summary-table th:nth-child(1),.summary-table td:nth-child(1){width:18%;}
  .summary-table th:nth-child(2),.summary-table td:nth-child(2){width:8%;text-align:left;}
  .summary-table th:nth-child(3),.summary-table td:nth-child(3){width:16%;}
  .summary-table th:nth-child(4),.summary-table td:nth-child(4){width:15%;}
  .summary-table th:nth-child(5),.summary-table td:nth-child(5){width:27%;font-size:9.5px;}
  .summary-table th:nth-child(6),.summary-table td:nth-child(6){width:16%;}
  /* 累計行(距離別・時間帯別サマリー内に挟む「累計」行)を通常行と視覚的に区別するスタイル */
  .summary-table tr.cum-row td{background:var(--card2);color:var(--muted);font-weight:500;}
  .summary-table tr.cum-row td.label{color:var(--muted);font-style:italic;}
  .summary-table tr.cum-row td:first-child{border-left:2px solid var(--amber);padding-left:4px;}
  .summary-table tr.cum-row td.pos{color:var(--green);}
  .summary-table tr.cum-row td.neg{color:var(--red);}
  .summary-table.has-target th:nth-child(1),.summary-table.has-target td:nth-child(1){width:15%;}
  .summary-table.has-target th:nth-child(2),.summary-table.has-target td:nth-child(2){width:7%;text-align:left;}
  .summary-table.has-target th:nth-child(3),.summary-table.has-target td:nth-child(3){width:17%;}
  .summary-table.has-target th:nth-child(4),.summary-table.has-target td:nth-child(4){width:15%;}
  .summary-table.has-target th:nth-child(5),.summary-table.has-target td:nth-child(5){width:20%;font-size:9.5px;}
  .summary-table.has-target th:nth-child(6),.summary-table.has-target td:nth-child(6){width:13%;}
  .summary-table.has-target th:nth-child(7),.summary-table.has-target td:nth-child(7){width:13%;}

  /* まとめ・履歴詳細の上部情報ブロックを1画面(ミドル・ロングまで)に収めるための圧縮レイアウト */
  .sum-compact .summary-time{margin-bottom:1px;}
  .sum-compact .summary-big{margin-bottom:3px;}
  .sum-compact .summary-sub{gap:9px;margin-bottom:4px;}
  .sum-compact .summary-sub b{font-size:13.5px;}
  .sum-grid{display:grid;grid-template-columns:98px 1fr 1fr;column-gap:6px;row-gap:3px;align-items:baseline;margin:5px 0 4px;padding-top:4px;border-top:1px solid var(--border);}
  .sum-grid .gt{font-size:10.5px;color:var(--muted);white-space:nowrap;line-height:1.3;}
  .sum-grid .gt .edit{font-size:9px;color:var(--muted2);text-decoration:underline dotted;cursor:pointer;margin-left:3px;}
  .sum-grid .gc{font-size:10.5px;color:var(--muted);text-align:center;white-space:nowrap;line-height:1.3;}
  .sum-grid .gc b{font-family:'PT Mono',monospace;font-size:13px;font-weight:700;color:var(--text);margin-left:3px;}
  .sum-grid .gc b.pos{color:var(--green);}
  .sum-grid .gc b.neg{color:var(--red);}
  .sum-grid .gc small{font-size:8.5px;color:var(--muted2);margin-left:1px;}
  .sum-compact .go-info-line{margin:2px 0 4px !important;line-height:1.35;}

  .analysis-title{font-size:11px;color:var(--muted);letter-spacing:.06em;margin:9px 0 4px;font-weight:500;}
  .fare-group{margin-bottom:6px;}
  .fare-group:last-child{margin-bottom:0;}
  .fare-group-title{font-size:9px;font-weight:700;color:var(--amber);margin-bottom:3px;display:flex;justify-content:space-between;}
  .fare-group-title.long{color:var(--red);}
  .fare-item{font-size:8.5px;padding:4px 0;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;}
  .fare-item .fi-time{color:var(--muted);flex-shrink:0;}
  .fare-item .fi-dist{color:var(--muted);flex-shrink:0;}
  .fare-item .fi-type{color:var(--amber);font-weight:600;flex-shrink:0;}
  .fare-item .fi-thanks{color:var(--amber);font-size:7.5px;font-weight:700;flex-shrink:0;background:rgba(232,163,61,0.15);padding:1px 4px;border-radius:3px;}
  .fare-item .fi-fare{font-weight:700;color:var(--text);margin-left:auto;flex-shrink:0;}
  .fare-empty{font-size:8.5px;color:var(--muted);padding:3px 0;}
  .analysis-list{display:flex;flex-direction:column;gap:4px;}
  .analysis-item{background:var(--card);border-left:3px solid #3b82f6;border-radius:9px;padding:6px 9px;}
  .analysis-item.good{border-left-color:#4ade80;}
  .analysis-item.warn{border-left-color:#f87171;}
  .analysis-item.trend{border-left-color:#fbbf24;}
  .analysis-item.info{border-left-color:#3b82f6;}
  .analysis-head{font-size:10px;color:var(--text);font-weight:700;margin-bottom:1px;}
  .analysis-body{font-size:10.5px;color:var(--text);line-height:1.4;}
  .analysis-body b{color:#f87171;}
  .analysis-body b{color:#f87171;}

  .summary-actions{display:flex;gap:8px;margin-top:10px;flex-shrink:0;}
  .summary-actions button{flex:1;}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--card2);border:1px solid var(--border);color:var(--text);
    font-size:12px;padding:9px 16px;border-radius:20px;opacity:0;
    transition:opacity .25s;pointer-events:none;z-index:20;
  }
  .toast.show{opacity:1;}

  /* まとめ画面・履歴詳細の文字サイズは出動中画面に揃える(2026-10-07) */
  #summaryView .nb, #historyView .nb{ font-size:inherit; font-weight:700; }
  #summaryView .summary-time, #historyView .summary-time{ font-size:9.5px; color:var(--text); line-height:1.25; }

<div class="wrap">

    <div style="position:relative;display:inline-flex;align-items:center;align-self:center;margin-left:2px;">
      <button id="themeToggleBtn" title="配色を選択" style="background:none;border:1px solid var(--border);border-radius:7px;padding:3px 7px;font-size:13px;line-height:1;vertical-align:middle;cursor:pointer;">🎨</button>
      <div id="themePickerPanel" style="display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;box-shadow:0 10px 28px -8px rgba(0,0,0,.35);grid-template-columns:repeat(3,1fr);gap:10px;width:130px;"></div>

</div>
<div class="toast" id="toast"></div>

<script>
const TAX_RATE = 1.10; // 消費税率(税込運賃 ÷ 1.10 = 税抜)
const CUTOFFS = [12,16,20,22]; // 時締め
const SECTION_TARGETS = [30000,50000,70000,90000]; // 各区切り時刻までの目標売上(税込)
const FINAL_TARGET = 121000; // 22時以降(出番終了まで)の目標売上(税込。税抜だとちょうど110,000円)
const TYPES = ['連配GO','自社無線','乗り場対応','流し','付け待ち','GO'];
const PAYS = ['GOPay','現金','それ以外','キャンセル','B空転','障割','定額負け'];

// entries: [{id,time,fare,toll,fee,dist,pay,note,comment}]
let state = { depTime:null, shiftDate:null, returnTime:null, entries:[], selType:'連配GO', selPay:'GOPay', goRank:null, renpaiStart:null, weather:null };
const DEFAULT_START_TIME = 7.5; // 出庫・連配開始のデフォルト時刻(07:30)。開始前の画面で修正可能
let setupDefaultsApplied = false; // 開始前画面の初期値(連配開始7:30)を今回の入力で適用済みか
let summaryMode = false;
let editingId = null;
let pendingElsePayConfirm = false; // 「それ以外」誤タップ防止用のダブルタップ確認状態
let listExpanded = false;
let moreMenuOpen = false; // 「⋯」メニュー(日報コピー・バックアップ・過去の出番・乗務終了など)の開閉
let mainViewMode = 'form'; // 'form'(記録フォーム) | 'graphs'(グラフ・サマリー) | 'records'(記録一覧) を排他的に切り替える
let summaryListExpanded = false;
let historyListExpanded = false;
let historyMode = false;
let historyDetailDate = null;
let historyExpandedYears = null;
let historyExpandedMonths = null;
function initHistoryExpand(dates){
  if(historyExpandedYears) return;
  historyExpandedYears = new Set();
  historyExpandedMonths = new Set();
  if(dates.length){
    const first = dates[0];
    historyExpandedYears.add(first.slice(0,4));
    historyExpandedMonths.add(first.slice(0,7));
  }
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._h);
  toast._h=setTimeout(()=>t.classList.remove('show'),1600);
}

// "0730" / "2510" (or "7:30" / "25:10") -> decimal hours
function parseTime(str){
  const s = str.trim();
  let m = s.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) m = s.match(/^(\d{1,2})(\d{2})$/);
  if(!m) return null;
  const h = parseInt(m[1],10), min = parseInt(m[2],10);
  if(min>59) return null;
  return h + min/60;
}
function fmtTime(dec){
  let h = Math.floor(dec);
  let min = Math.round((dec-h)*60);
  if(min===60){min=0;h+=1;}
  return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0');
}
function fmtYen(n){ return Math.round(n).toLocaleString('ja-JP'); }
function fmtYen10(n){ return (Math.round(n/10)*10).toLocaleString('ja-JP'); }
function fmtKm(n){ return Number(n||0).toLocaleString('ja-JP',{minimumFractionDigits:1,maximumFractionDigits:1}); }
function fmtNum(n){ return Number(n).toLocaleString('ja-JP'); }
function fmtHM(dec){
  const h=Math.floor(dec); const m=Math.round((dec-h)*60);
  return h+'時間'+m+'分';
}
const WEEKDAY_JP = ['日','月','火','水','木','金','土'];
// 日本の祝日判定(固定日・第n月曜・春分秋分の計算式・振替休日に対応。ハードコードのない年非依存ロジック)
function nthMondayOfMonth(year, month, nth){
  const d = new Date(year, month-1, 1);
  let count = 0;
  while(d.getMonth()===month-1){
    if(d.getDay()===1){ count++; if(count===nth) return d.getDate(); }
    d.setDate(d.getDate()+1);
  }
  return null;
}
function equinoxDay(year, isVernal){
  const a = isVernal ? 20.8431 : 23.2488;
  return Math.floor(a + 0.242194*(year-1980) - Math.floor((year-1980)/4));
}
function getJapaneseHolidayName(date){
  const y = date.getFullYear(), m = date.getMonth()+1, day = date.getDate();
  const FIXED = {
    '1-1':'元日', '2-11':'建国記念の日', '2-23':'天皇誕生日', '4-29':'昭和の日',
    '5-3':'憲法記念日', '5-4':'みどりの日', '5-5':'こどもの日', '8-11':'山の日',
    '11-3':'文化の日', '11-23':'勤労感謝の日'
  };
  const fixedName = FIXED[`${m}-${day}`];
  if(fixedName) return fixedName;
  if(m===1 && day===nthMondayOfMonth(y,1,2)) return '成人の日';
  if(m===7 && day===nthMondayOfMonth(y,7,3)) return '海の日';
  if(m===9 && day===nthMondayOfMonth(y,9,3)) return '敬老の日';
  if(m===10 && day===nthMondayOfMonth(y,10,2)) return 'スポーツの日';
  if(m===3 && day===equinoxDay(y,true)) return '春分の日';
  if(m===9 && day===equinoxDay(y,false)) return '秋分の日';
  return null;
}
function isJapaneseHoliday(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  const name = getJapaneseHolidayName(d);
  if(name) return name;
  // 振替休日: 月曜日で前日(日曜)が祝日だった場合
  if(d.getDay()===1){
    const prev = new Date(d); prev.setDate(prev.getDate()-1);
    if(prev.getDay()===0 && getJapaneseHolidayName(prev)) return '振替休日';
  }
  // 国民の休日: 日曜以外で、前日・翌日がどちらも祝日に挟まれた平日(例: 9月のシルバーウィーク中日)
  if(d.getDay()!==0){
    const prev = new Date(d); prev.setDate(prev.getDate()-1);
    const next = new Date(d); next.setDate(next.getDate()+1);
    if(getJapaneseHolidayName(prev) && getJapaneseHolidayName(next)) return '国民の休日';
  }
  return null;
}
function addDaysStr(dateStr, delta){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+delta);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function isRestDayStr(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return false;
  return d.getDay()===0 || d.getDay()===6 || !!isJapaneseHoliday(dateStr);
}
// 土日・祝日が3日以上連続する「連休」の中に対象日が含まれるか判定し、その連休内での位置を返す。
// 単なる週末(土日の2連休)は対象外(祝日が絡む3連休以上のみ、ゴールデンウィーク/シルバーウィーク等の特筆すべき連休として扱う)。
function getHolidayStretchInfo(dateStr){
  if(!isRestDayStr(dateStr)) return null;
  let start = dateStr;
  while(isRestDayStr(addDaysStr(start,-1))){ start = addDaysStr(start,-1); }
  let end = dateStr;
  while(isRestDayStr(addDaysStr(end,1))){ end = addDaysStr(end,1); }
  let len = 0, cur = start;
  while(cur <= end){ len++; cur = addDaysStr(cur,1); }
  if(len < 3) return null;
  const isFirstDay = (dateStr === start);
  const isLastDay = (dateStr === end);
  const dayIndex = Math.round((new Date(dateStr+'T00:00:00') - new Date(start+'T00:00:00')) / 86400000) + 1;
  const month = parseInt(dateStr.slice(5,7), 10);
  let name = `${len}連休`;
  if(month===4 || month===5) name = 'ゴールデンウィーク';
  else if(month===9) name = 'シルバーウィーク';
  return { len, isFirstDay, isLastDay, dayIndex, name, start, end };
}
function todayLocalStr(){
  const d = new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function shiftDayTag(dateStr){
  if(!dateStr) return '';
  const day = parseInt(String(dateStr).slice(8,10),10);
  if(isNaN(day)) return '';
  const tags = [];
  if(day%2===0) tags.push('羽番');
  if(day%10===6) tags.push('NHK番');
  return tags.join(' ');
}
function depElapsedMin(depTime){
  // 出庫からの経過分。出番日(shiftDate)基準で日付またぎを正しく扱う。出庫前は負の値
  const n = new Date();
  if(typeof state!=='undefined' && state && state.shiftDate){
    const p = String(state.shiftDate).split('-');
    const base = new Date(+p[0], +p[1]-1, +p[2]);
    if(!isNaN(base.getTime())){
      return (n.getTime() - (base.getTime() + Math.round(depTime*60)*60000)) / 60000;
    }
  }
  let d = n.getHours()*60 + n.getMinutes() - Math.round(depTime*60);
  if(d < -720) d += 1440;
  return d;
}
function kaisoRemainText(depTime){
  if(depTime==null) return '';
  const mins = Math.round(19.5*60 - depElapsedMin(depTime));
  const fmtHM = (m)=>{
    const h = Math.floor(m/60), mm = m%60;
    return (h>0 ? '<span class="nb">'+h+'</span>時間' : '') + '<span class="nb">'+mm+'</span>分';
  };
  if(mins >= 0) return '(あと'+fmtHM(mins)+')';
  return '(<span style="color:var(--red);">'+fmtHM(-mins)+'</span>超過)';
}
function elapsedClockText(depTime){
  if(depTime==null) return '0:00';
  let diff = Math.floor(depElapsedMin(depTime));
  if(diff < 0) diff = 0; // 出庫時刻前は0:00
  return Math.floor(diff/60) + ':' + String(diff%60).padStart(2,'0');
}
function updateElapsedClock(){
  const el = document.getElementById('elapsedClock');
  if(!el || typeof state==='undefined' || !state || state.depTime==null) return;
  const t = elapsedClockText(state.depTime);
  if(el.textContent !== t) el.textContent = t;
}
function updateKaisoRemain(){
  const el = document.getElementById('kaisoRemain');
  if(!el || typeof state==='undefined' || !state || state.depTime==null) return;
  const t = kaisoRemainText(state.depTime);
  if(el.innerHTML !== t) el.innerHTML = t;
}
setInterval(()=>{ updateKaisoRemain(); updateElapsedClock(); }, 5000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ updateKaisoRemain(); updateElapsedClock(); } });
function fmtDateLabel(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return '';
  return `${d.getMonth()+1}/${d.getDate()}(${WEEKDAY_JP[d.getDay()]})`;
}

/* ---------- persistence (localStorage: ダウンロードして単体で開いても保存されるように) ---------- */
const LS_PREFIX = 'andon-meter:';
async function saveState(){
  if(!state.shiftDate) return;
  try{
    localStorage.setItem(LS_PREFIX+'shift:'+state.shiftDate, JSON.stringify(state));
    localStorage.setItem(LS_PREFIX+'current-shift', state.shiftDate);
  }catch(e){ /* 保存失敗は静かに無視、次回操作時に再試行される */ }
  autoBackupToClipboard(); // localStorageが効かない環境向けの保険として、常にクリップボードにも最新状態を保持
}
async function autoBackupToClipboard(){
  try{
    const text = buildBackupText();
    await navigator.clipboard.writeText(text);
  }catch(e){ /* クリップボード権限が無い場合は静かに無視 */ }
}
async function clearCurrentPointer(){
  try{ localStorage.removeItem(LS_PREFIX+'current-shift'); }catch(e){}
}
async function tryResume(){
  try{
    const cur = localStorage.getItem(LS_PREFIX+'current-shift');
    if(!cur) return false;
    const raw = localStorage.getItem(LS_PREFIX+'shift:'+cur);
    if(!raw) return false;
    const loaded = JSON.parse(raw);
    if(loaded.depTime===null || loaded.depTime===undefined) return false;
    state = Object.assign({selType:'連配GO', selPay:'GOPay'}, loaded);
    // 帰庫時刻が既に入っている(=乗務終了・まとめを見る、まで進んでいた)場合は、
    // リロード等でメモリ上のsummaryModeが失われても、まとめ画面から再開する。
    if(state.returnTime!==null && state.returnTime!==undefined){ summaryMode = true; }
    return true;
  }catch(e){ return false; }
}

/* ---------- career shift counter (通算出番数・当月度出番) ---------- */
const CAREER_LS_KEY = LS_PREFIX+'career-counter';
function monthKeyOf(dateStr){
  return dateStr ? dateStr.slice(0,7) : ''; // 'YYYY-MM'
}
// localStorageに保存されている全ての出番日(taxi-ops:shift:YYYY-MM-DD)を昇順で返す。
// 通算・今月度の出番数はここから毎回数え直すので、手動カウンターのようにズレることがない。
function shiftDateKeysAll(){
  const prefix = LS_PREFIX+'shift:';
  const out = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(prefix)===0) out.push(k.slice(prefix.length));
  }
  out.sort();
  return out;
}
// 通算出番数の基準較正(一度だけ設定する。「この日付の時点で通算◯◯出番目だった」という一点だけ覚えておき、
// それ以降は実際に保存されている出番データの件数を足すだけで自動的に求める)
const CAREER_BASE_LS_KEY = LS_PREFIX+'career-base';
function loadCareerBase(){
  try{
    const raw = localStorage.getItem(CAREER_BASE_LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  // 未較正時の初期値(2026-08-10時点で通算183出番=この日の出番が184出番目、という較正)
  return { offset:183, asOfDate:'2026-08-09' };
}
function saveCareerBase(offset, asOfDate){
  try{ localStorage.setItem(CAREER_BASE_LS_KEY, JSON.stringify({offset, asOfDate})); }catch(e){}
}
// 今月度の予定出番数(例:13)は実績データからは分からない「今月の目標件数」なので、これだけ手動設定のまま残す。
const MONTH_PLAN_LS_KEY = LS_PREFIX+'month-plan-total';
function loadMonthPlanTotal(monthKey){
  try{
    const raw = localStorage.getItem(MONTH_PLAN_LS_KEY);
    if(raw){ const o = JSON.parse(raw); if(o.monthKey===monthKey) return o.total; }
  }catch(e){}
  return 13; // 既定値
}
function saveMonthPlanTotal(monthKey, total){
  try{ localStorage.setItem(MONTH_PLAN_LS_KEY, JSON.stringify({monthKey, total})); }catch(e){}
}
// 指定日時点での通算出番数を、較正基準日以降に実際に保存されている出番の件数から自動計算する。
function computeCareerNoFor(shiftDate){
  const base = loadCareerBase();
  const dates = shiftDateKeysAll();
  const countAfterBase = dates.filter(d=>d>base.asOfDate && d<=shiftDate).length;
  return base.offset + countAfterBase;
}
// 指定日が属する月の中で、その日までに何出番あったかを実際の保存データから自動計算する。
function computeMonthIndexFor(shiftDate){
  const mKey = monthKeyOf(shiftDate);
  const dates = shiftDateKeysAll();
  return dates.filter(d=>monthKeyOf(d)===mKey && d<=shiftDate).length;
}
function shiftNoLineHTML(st){
  if(st.careerNo==null) return '';
  return `通算<span class="nb">${fmtNum(st.careerNo)}</span>出番目 ・ 今月度<span class="nb">${st.monthTotal}</span>出番中<span class="nb">${st.monthIndex}</span>出番目`;
}
function ensureShiftNumber(){
  const careerNo = computeCareerNoFor(state.shiftDate);
  const monthIndex = computeMonthIndexFor(state.shiftDate);
  const monthTotal = loadMonthPlanTotal(monthKeyOf(state.shiftDate));
  if(state.careerNo!==careerNo || state.monthIndex!==monthIndex || state.monthTotal!==monthTotal){
    state.careerNo = careerNo;
    state.monthIndex = monthIndex;
    state.monthTotal = monthTotal;
    saveState();
  }
}

/* ---------- monthly cumulative revenue (月間累計営収・税込/税抜併記) ---------- */
const MONTH_REV_LS_KEY = LS_PREFIX+'month-revenue2'; // v5で新キー化(旧キーの壊れた累計は引き継がない)
function loadMonthRevenue(){
  // 基準点 {monthKey, incl, excl, asOfDate} = 「asOfDate(含む)までの当月出番の累計」。基準が無い月は0から保存済み出番を合算する。
  try{
    const raw = localStorage.getItem(MONTH_REV_LS_KEY);
    if(raw){ const o = JSON.parse(raw); if(o && o.asOfDate!==undefined) return o; }
  }catch(e){}
  // アプリ導入前の出番を含む8月度だけ初期値(2026-08-10時点、前出番までの累計 税込487,210円 / 税抜442,920円)
  return { monthKey:'2026-08', incl:487210, excl:442920, asOfDate:'2026-08-09' };
}
function saveMonthRevenue(m){
  try{ localStorage.setItem(MONTH_REV_LS_KEY, JSON.stringify(m)); }catch(e){}
}
// 税抜は出番ごとに10円単位へ丸めて合算(各出番画面の「税抜」表示と累計が一致するように)
function excl10(x){ return Math.floor((Math.round(x)*10+55)/110)*10; } // x/1.1 の1の位を四捨五入(整数演算で5円ちょうども切り上げ)
function shiftPureOf(st){ // 運賃のみ(キャンセル・B空転・定額負けを除く)= summarizeShiftのpureTotalと同じ
  return (st.entries||[]).filter(e=>!SPECIAL_PAYS.includes(e.pay)).reduce((a,e)=>a+netFare(e),0);
}
// 指定出番「より前」の月間累計(税込/税抜)を、基準点+保存済み出番の実データから毎回計算する。
// 履歴の記録編集・出番削除もそのまま反映される(旧方式は✕で1回加算するだけだったためズレた)。
function monthRevPriorFor(shiftDate){
  const mKey = monthKeyOf(shiftDate);
  const m = loadMonthRevenue();
  let incl = 0, excl = 0, asOf = mKey+'-00';
  if(m.monthKey===mKey){ incl = m.incl||0; excl = m.excl||0; asOf = m.asOfDate||asOf; }
  shiftDateKeysAll().forEach(d=>{
    if(monthKeyOf(d)!==mKey) return;
    let st=null; try{ st = JSON.parse(localStorage.getItem(LS_PREFIX+'shift:'+d)); }catch(e){}
    if(!st) return;
    const pure = shiftPureOf(st);
    if(shiftDate>asOf){ if(d>asOf && d<shiftDate){ incl += pure; excl += excl10(pure); } }
    else { if(d>=shiftDate && d<=asOf){ incl -= pure; excl -= excl10(pure); } }
  });
  return { incl:Math.round(incl), excl:Math.round(excl) };
}
// 互換用(旧: 出番開始時に基準を固定)。動的計算になったため、表示用にstateへ写すだけ。

// 月間目標(税込)は月ごとに保存する({'YYYY-MM': 金額})。設定していない月は、それより前の直近の月の目標を引き継ぐ。
// 修正してもその月の出番にだけ効き、過去の月の達成率は変わらない。
const MONTH_TARGET_LS_KEY = LS_PREFIX+'month-target'; // 旧形式(全月共通の1値)。初回のみ移行に使う
const MONTH_TARGETS_LS_KEY = LS_PREFIX+'month-targets'; // 新形式(月ごと)
const MONTH_TARGET_BASE_KEY = '0000-00'; // 旧共通目標の引き継ぎ用(どの月より前でもフォールバックされる)
function loadMonthTargetsMap(){
  try{
    const raw = localStorage.getItem(MONTH_TARGETS_LS_KEY);
    let m = {};
    if(raw){ const x = JSON.parse(raw); if(x && typeof x==='object') m = x; }
    // 旧形式(全月共通の1値)からの移行: 旧の目標は、それまで全ての月に使われていたので
    // 「最初の月より前すべて」の基準(BASE_KEY)として引き継ぐ。今月分としても明示的に持たせる。
    const old = localStorage.getItem(MONTH_TARGET_LS_KEY);
    if(old && !m[MONTH_TARGET_BASE_KEY]){
      const t = JSON.parse(old);
      if(t && t.incl){
        m[MONTH_TARGET_BASE_KEY] = t.incl;
        const cm = monthKeyOf(todayLocalStr());
        if(!m[cm]) m[cm] = t.incl;
        localStorage.setItem(MONTH_TARGETS_LS_KEY, JSON.stringify(m));
      }
    }
    return m;
  }catch(e){}
  return {};
}
function loadMonthlyTarget(monthKey){
  const m = loadMonthTargetsMap();
  if(!monthKey) monthKey = monthKeyOf(todayLocalStr());
  if(m[monthKey]) return m[monthKey];
  const earlier = Object.keys(m).filter(k=>k<monthKey).sort();
  return earlier.length ? m[earlier[earlier.length-1]] : null;
}
function saveMonthlyTarget(monthKey, incl){
  try{
    const m = loadMonthTargetsMap();
    m[monthKey] = incl;
    localStorage.setItem(MONTH_TARGETS_LS_KEY, JSON.stringify(m));
  }catch(e){}
}

/* ---------- screenshot capture ---------- */
async function buildCanvasForElement(elementId){
  const el = document.getElementById(elementId);
  if(!el){ toast('対象が見つかりませんでした'); return null; }
  if(typeof html2canvas === 'undefined'){
    toast('画像化ライブラリの読み込みに失敗しました(通信環境をご確認ください)');
    return null;
  }
  try{
    const bgColor = getComputedStyle(document.body).getPropertyValue('--bg').trim() || '#12151b';
    return await html2canvas(el, { backgroundColor:bgColor, useCORS:true, scale:2 });
  }catch(e){
    toast('画像化に失敗しました('+(e.message||'不明なエラー')+')');
    return null;
  }
}
// 複数の要素(異なる親を持つDOMでも可)を縦に連結して1枚のcanvasにする。
async function buildMergedCanvas(elementIds, scale){
  const els = elementIds.map(id=>document.getElementById(id)).filter(Boolean);
  if(!els.length){ toast('対象が見つかりませんでした'); return null; }
  if(typeof html2canvas === 'undefined'){
    toast('画像化ライブラリの読み込みに失敗しました(通信環境をご確認ください)');
    return null;
  }
  const bgColor = getComputedStyle(document.body).getPropertyValue('--bg').trim() || '#12151b';
  let canvases;
  try{
    canvases = [];
    for(const el of els){
      canvases.push(await html2canvas(el, { backgroundColor:bgColor, useCORS:true, scale:(scale||2) }));
    }
  }catch(e){
    toast('画像化に失敗しました('+(e.message||'不明なエラー')+')');
    return null;
  }
  const width = Math.max(...canvases.map(c=>c.width));
  const totalHeight = canvases.reduce((s,c)=>s+c.height, 0);
  const merged = document.createElement('canvas');
  merged.width = width;
  merged.height = totalHeight;
  const ctx = merged.getContext('2d');
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, width, totalHeight);
  let y = 0;
  for(const c of canvases){
    ctx.drawImage(c, 0, y);
    y += c.height;
  }
  return merged;
}
async function captureAndShare(elementId, filename){
  toast('画像を作成しています…');
  const canvas = await buildCanvasForElement(elementId);
  if(!canvas) return;
  shareCanvasAsPng(canvas, filename);
}
// 画像の上下にある何も描かれていない余白(背景色だけの行)を切り落とす。上下に細い余白(pad px)だけ残す。左右は触らない。
function trimCanvasVertical(canvas, pad){
  try{
    const w=canvas.width, h=canvas.height;
    const ctx=canvas.getContext('2d');
    const d=ctx.getImageData(0,0,w,h).data;
    const bg=[d[0],d[1],d[2]];   // 左上の1画素=背景色
    const tol=6;
    const rowEmpty=(y)=>{
      const o=y*w*4;
      for(let x=0;x<w;x++){
        const i=o+x*4;
        if(Math.abs(d[i]-bg[0])>tol||Math.abs(d[i+1]-bg[1])>tol||Math.abs(d[i+2]-bg[2])>tol) return false;
      }
      return true;
    };
    let top=0; while(top<h && rowEmpty(top)) top++;
    let bot=h-1; while(bot>top && rowEmpty(bot)) bot--;
    if(top>=h) return canvas;   // 全面が背景色なら何もしない
    const y0=Math.max(0, top-pad), y1=Math.min(h, bot+1+pad);
    if(y0===0 && y1===h) return canvas;
    const out=document.createElement('canvas');
    out.width=w; out.height=y1-y0;
    const octx=out.getContext('2d');
    octx.fillStyle='rgb('+bg[0]+','+bg[1]+','+bg[2]+')';
    octx.fillRect(0,0,out.width,out.height);
    octx.drawImage(canvas, 0, y0, w, out.height, 0, 0, w, out.height);
    return out;
  }catch(e){ return canvas; }   // 読み取れない場合は切り落とさずそのまま
}
// ①画像(ヘッダー+情報ブロック)を、スマホ縦1画面いっぱいのレイアウトで1枚のcanvasにする。撮影の間だけ .cap-tall を付け、終わったら必ず元に戻す。
async function buildTallInfoCanvas(elementIds){
  const els = elementIds.map(id=>document.getElementById(id)).filter(Boolean);
  els.forEach(el=>el.classList.add('cap-tall'));
  let merged=null;
  try{
    const hdr = els[0], info = els[els.length-1];
    if(info){
      const w = info.getBoundingClientRect().width;
      const hh = (hdr && hdr!==info) ? hdr.getBoundingClientRect().height : 0;
      // 縦横比 約1:2(スマホの画面)に合わせる。中身がそれより長ければ、そのまま長くなる。
      info.style.minHeight = Math.max(0, Math.round(w*2.0 - hh))+'px';
    }
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    merged = await buildMergedCanvas(elementIds, 3);
  }finally{
    els.forEach(el=>{ el.classList.remove('cap-tall'); el.style.minHeight=''; });
  }
  return merged ? trimCanvasVertical(merged, 8) : null;   // 画面倍率が高いので、上下は少しだけ余白を残す
}
async function captureAndShareMulti(elementIds, filename){
  toast('画像を作成しています…');
  const canvas = await buildTallInfoCanvas(elementIds);
  if(!canvas) return;
  shareCanvasAsPng(canvas, filename);
}
/* ---------- ファイルの保存(アプリ版) ----------
   Androidアプリの画面部品(WebView)は、ブラウザのような「ダウンロード」ができない。
   そこで、アプリ版では ファイルを一時領域に書き出して、OSの共有シートを開き、保存先(マイファイル・ドライブ・LINEなど)を選んでもらう。
   ブラウザ版・部品が無い古いアプリでは、従来どおりのダウンロードにする。 */
/* ---------- バックアップを確実に退避する仕組み ----------
   ・最後にバックアップした日時を記録し、古いと「⋯」に●を出す
   ・ファイル保存が使えないときのために、全データを画面に出して「コピー」できるモーダルを用意する
   ・「保存機能の診断」で、どこが使えないかを画面に出す */
const LAST_BACKUP_KEY = LS_PREFIX+'last-backup';
function markBackupDone(){ try{ localStorage.setItem(LAST_BACKUP_KEY, String(Date.now())); }catch(e){} const b=document.getElementById('moreMenuBtn'); if(b) b.innerHTML='⋯'; }
function backupAgeDays(){ const v=parseInt(localStorage.getItem(LAST_BACKUP_KEY)||'0',10); return v?(Date.now()-v)/86400000:null; }
function hasAnyShiftData(){ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf(LS_PREFIX+'shift:')===0) return true; } return false; }
function backupStale(){ const a=backupAgeDays(); return hasAnyShiftData() && (a===null || a>1.5); }
function closeBackupModal(){ const m=document.getElementById('backupModal'); if(m) m.remove(); }
async function copyTextSmart(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}

function diagHM(sec){ const d=new Date(sec*1000); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function taxiopsTrackHealth(){
  const dates=listTrackDates(); const D=(trackDate&&dates.indexOf(trackDate)<0)?trackDate:dates[0];
  const L=[];
  if(!D){ openBackupModal('軌跡のデータがありません。','🛰 記録の健康診断','',false); return; }
  const pts=(D===trackDate)?trackPts:trackLoad(D);
  const st=trackStats(pts);
  L.push('対象: '+D+'('+pts.length+'点・GPS走行 '+st.km.toFixed(1)+'km)');
  L.push('状態: '+(NATIVE_BG?'アプリ版':'ブラウザ版')+' / 記録='+(trackWatchId!==null?'動作中':'停止中')+' / 試行'+(typeof nativeTries!=='undefined'?nativeTries:'-')+'回'+(nativeErrText?' / 最新エラー: '+nativeErrText:''));
  // 時間帯別の点数
  const byH={}; pts.forEach(p=>{ const h=new Date(p.t*1000).getHours(); byH[h]=(byH[h]||0)+1; });
  const hs=Object.keys(byH).map(Number).sort((a,b)=>a-b);
  L.push('\n【1時間ごとの点数】');
  hs.forEach(h=>L.push(String(h).padStart(2,'0')+'時 '+String(byH[h]).padStart(4,' ')+' '+'■'.repeat(Math.min(30,Math.round(byH[h]/20)))));
  // 5分以上の途切れ
  const gaps=[]; for(let i=1;i<pts.length;i++){ const dt=pts[i].t-pts[i-1].t; if(dt>=300) gaps.push([pts[i-1].t,pts[i].t]); }
  // 画面が隠れていた期間(診断ログ)
  let ev=[]; try{ ev=JSON.parse(localStorage.getItem('taxiops-diag:ev')||'[]'); }catch(e){}
  const hid=[]; let hs0=null; ev.forEach(e=>{ if(e[1]==='hid') hs0=e[0]; else if((e[1]==='vis'||e[1]==='boot') && hs0!==null){ hid.push([hs0,e[0]]); hs0=null; } });
  if(hs0!==null) hid.push([hs0,Math.floor(Date.now()/1000)]);
  const overlap=(a,b)=>{ let o=0; hid.forEach(h=>{ o+=Math.max(0,Math.min(b,h[1])-Math.max(a,h[0])); }); return o/Math.max(1,b-a); };
  L.push('\n【5分以上の途切れ '+gaps.length+'件】');
  gaps.slice(0,40).forEach(g=>{ const mins=Math.round((g[1]-g[0])/60); const ov=hid.length?Math.round(overlap(g[0],g[1])*100)+'%':'-'; L.push(diagHM(g[0])+'〜'+diagHM(g[1])+'('+mins+'分) 画面が隠れていた割合: '+ov); });
  if(gaps.length>40) L.push('…ほか'+(gaps.length-40)+'件');
  L.push('\n【最近の動き(画面の出入り・エラー)】');
  if(!ev.length) L.push('(この版から記録を始めました。次の出番のあとに見てください)');
  ev.slice(-40).forEach(e=>L.push(diagHM(e[0])+' '+e[1]+(e[2]?' '+e[2]:'')));
  openBackupModal(L.join('\n'),'🛰 記録の健康診断','この画面をスクショして、見せてください(長いときは下までスクロール)。',false);
}

function blobToBase64(blob){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(r.error); r.readAsDataURL(blob); });
}
function canvasToBlobP(canvas){ return new Promise((res)=>canvas.toBlob((b)=>res(b),'image/png')); }
async function nativeShareFiles(files){      // files=[{name,blob}] → 成功=true / キャンセル='cancel' / 失敗=false(理由は window.__lastSaveError)
  if(typeof NATIVE_BG==='undefined' || !NATIVE_BG) return false;
  window.__lastSaveError='';
  try{
    const FS=window.Capacitor.registerPlugin('Filesystem'), SH=window.Capacitor.registerPlugin('Share');
    const uris=[];
    for(const f of files){
      const data=await blobToBase64(f.blob);
      const r=await FS.writeFile({path:'taxi-ops/'+f.name, data, directory:'CACHE', recursive:true});
      uris.push(r.uri);
    }
    await SH.share({title:files[0].name, files:uris, dialogTitle:'保存先を選んでください'});
    return true;
  }catch(e){
    const m=String((e&&e.message)||e||'');
    if(/cancel|dismiss/i.test(m)) return 'cancel';    // 共有シートを閉じただけ
    console.warn('native save failed', m);
    window.__lastSaveError=m||'不明なエラー';
    return false;
  }
}
function anchorDownloadBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}
async function saveBlobSmart(blob, filename, msgBrowser, backupText){

    else toast('保存できませんでした: '+why);

/* ---------- 画像をピクチャ(ギャラリー)へ直接保存(アプリ版、app14〜) ----------
   画像はMediaプラグインで端末の「TAXI-OPS」アルバムへ直接保存する(ギャラリー・Xの添付画面などから選べる)。
   Mediaプラグインが入っていない古いAPK・保存に失敗したときは、従来の共有シート方式に戻す。 */
const PIC_ALBUM = 'TAXI-OPS';
async function nativeSavePicture(canvas, filename){   // 成功=true / 失敗=false(理由は window.__lastSaveError) / 部品なし='noplugin'
  if(typeof NATIVE_BG==='undefined' || !NATIVE_BG) return 'noplugin';
  window.__lastSaveError='';
  try{
    const C=window.Capacitor;
    const M=C.registerPlugin('Media');
    const ap=await M.getAlbumsPath();
    const album=String(ap&&ap.path||'').replace(/\/+$/,'')+'/'+PIC_ALBUM;
    try{ await M.createAlbum({name:PIC_ALBUM}); }catch(e){}      // すでにある場合のエラーは無視
    const d=new Date(), p2=(n)=>String(n).padStart(2,'0');
    const base=String(filename).replace(/\.png$/i,'')+'_'+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds());
    await M.savePhoto({path:canvas.toDataURL('image/png'), albumIdentifier:album, fileName:base});
    return true;
  }catch(e){
    const m=String((e&&e.message)||e||'');
    if(/UNIMPLEMENTED|not implemented|not available/i.test(m) || (e&&e.code==='UNIMPLEMENTED')) return 'noplugin';
    console.warn('native picture save failed', m);
    window.__lastSaveError=m||'不明なエラー';
    return false;
  }
}
function shareCanvasAsPng(canvas, filename){
  if(typeof NATIVE_BG!=='undefined' && NATIVE_BG){   // アプリ版: まずピクチャへ直接保存、だめなら共有シートで保存先を選ぶ
    nativeSavePicture(canvas, filename).then((r)=>{
      if(r===true){ toast('画像をピクチャの「'+PIC_ALBUM+'」に保存しました'); return; }
      canvasToBlobP(canvas).then((blob)=>{ if(!blob){ toast('画像の生成に失敗しました'); return; } saveBlobSmart(blob, filename, '画像を保存しました'); });
    });
    return;
  }
  // Androidのブラウザ(Brave等)ではblob: URLへのダウンロードがOSの共有シート経由になり
  // 「共有先を選ぶ画面」が挟まることがあるため、data: URLでの直接ダウンロードを試す。
  try{
    const dataUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataUrl; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('画像を保存しました');
  }catch(e){
    canvas.toBlob((blob)=>{
      if(!blob){ toast('画像の生成に失敗しました'); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 5000);
      toast('画像を保存しました');
    }, 'image/png');
  }
}
function canvasToPngFile(canvas, filename){
  return new Promise((resolve)=>{
    canvas.toBlob((blob)=>{
      resolve(blob ? new File([blob], filename, {type:'image/png'}) : null);
    }, 'image/png');
  });
}

// 4分割保存(①②③④)をボタン1つで実行する。要素IDまたは配列(複数要素を縦連結)を順に渡す。
// ブラウザの「複数ファイル自動ダウンロード」ブロックの影響で1枚目すら保存されないことがあったため、
// 対応環境ではOS標準の共有シート(Web Share API)で4枚まとめて一度に渡す方式を優先し、
// 非対応環境のみ従来の順次ダウンロードにフォールバックする。
async function captureAndShareAllSplits(parts, filenames){
  const canvases = [];
  for(let i=0;i<parts.length;i++){
    toast(`画像を作成しています…(${i+1}/${parts.length})`);
    const part = parts[i];
    const canvas = Array.isArray(part) ? await buildTallInfoCanvas(part) : await buildCanvasForElement(part);
    if(!canvas) return; // 個別のエラー内容は上記ビルド関数がtoast済み
    canvases.push(canvas);
  }
  if(typeof NATIVE_BG!=='undefined' && NATIVE_BG){
    // アプリ版: まず4枚をピクチャの「TAXI-OPS」へ直接保存する(共有シート経由だと、Xが後から画像を読めず投稿に失敗することがあるため)
    let saved=0, first=null;
    // ギャラリー/Xの画像選択は「新しい順」に並ぶので、④→①の順に保存して、一覧が①②③④の順に見えるようにする
    // (保存時刻の秒が同じだと順序が崩れるため、1枚ごとに1.2秒あける)
    for(let k=0;k<canvases.length;k++){
      const i=canvases.length-1-k;
      toast(`ギャラリーに保存しています…(${k+1}/${canvases.length})`);
      const r=await nativeSavePicture(canvases[i], filenames[i]);
      if(r!==true){ first=r; break; }
      saved++;
      if(k<canvases.length-1) await new Promise(rs=>setTimeout(rs,1200));
    }
    if(saved===canvases.length){
      alert('画像'+saved+'枚をピクチャの「'+PIC_ALBUM+'」に保存しました。\nXの画像ボタン →「コレクション」→「'+PIC_ALBUM+'」を開くと、①②③④の順に並びます。①→④の順にタップして選んでください(選んだ順が投稿の順になります)。');
      return;
    }
    if(first!=='noplugin'){   // 失敗の理由を画面に残す(共有シートには勝手に切り替えない)
      alert('ギャラリーへの保存に失敗しました。\n成功: '+saved+'/'+canvases.length+'枚\n理由: '+(window.__lastSaveError||'不明'));
      return;
    }
    toast('このAPKは画像の直接保存に未対応のため、共有シートに渡します');
    const files=[];
    for(let i=0;i<canvases.length;i++){ const b=await canvasToBlobP(canvases[i]); if(b) files.push({name:filenames[i], blob:b}); }
    const r=files.length ? await nativeShareFiles(files) : false;
    if(r===true){ toast('共有先で「X」などを選んでください(画像'+files.length+'枚)'); return; }
    if(r==='cancel'){ toast('共有をキャンセルしました'); return; }
    toast('画像を保存できませんでした: '+(window.__lastSaveError||'不明')); return;   // アプリ版のWebViewでは、従来のダウンロードは動かないので、偽の成功表示をしない
  }
  // Web Share(共有シート経由)は、渡した枚数を保存先アプリが正しく受け取らないことがある(4枚渡しても1枚しか保存されない事例あり)ため、
  // アプリの受け取り方に左右されない、直接の順次ダウンロードに統一する。
  for(let i=0;i<canvases.length;i++){
    toast(`画像を保存しています…(${i+1}/${canvases.length})`);
    shareCanvasAsPng(canvases[i], filenames[i]);
    if(i < canvases.length-1) await new Promise(r=>setTimeout(r, 800));
  }
  toast('4分割まとめて保存しました');
}

/* ---------- history ---------- */
function listShiftDates(){
  const dates = [];
  try{
    for(let i=0;i<localStorage.length;i++){
      const key = localStorage.key(i);
      if(key && key.startsWith(LS_PREFIX+'shift:')){
        dates.push(key.slice((LS_PREFIX+'shift:').length));
      }
    }
  }catch(e){}
  return dates.sort().reverse();
}
function loadShiftByDate(date){
  try{
    const raw = localStorage.getItem(LS_PREFIX+'shift:'+date);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function renderHistory(){
  if(historyDetailDate){
    renderHistoryDetail(historyDetailDate);
    return;
  }
  const dates = listShiftDates();
  initHistoryExpand(dates);

  const yearMap = new Map();
  dates.forEach(d=>{
    const y = d.slice(0,4), m = d.slice(5,7);
    if(!yearMap.has(y)) yearMap.set(y, new Map());
    const monthMap = yearMap.get(y);
    if(!monthMap.has(m)) monthMap.set(m, []);
    monthMap.get(m).push(d);
  });

  const dateRowHTML = (d) => {
    const st = loadShiftByDate(d);
    if(!st) return '';
    const s = summarizeShift(st);
    const isCurrent = (state.shiftDate===d && state.depTime!==null && (state.returnTime===null || state.returnTime===undefined));
    return `
      <div class="entry" data-date="${d}">
        <div class="entry-row">
          <div class="entry-mid entry-row-tap" data-date="${d}" style="cursor:pointer;">
            <span class="entry-type">${fmtDateLabel(d)}</span>${isCurrent?'<span class="entry-pay entry-live">進行中</span>':''}
            <div class="entry-fare-sub" style="text-align:left;margin-top:3px;color:var(--text);">出庫${fmtTime(st.depTime)} ・ ${s.count}組 ・ 税込運賃¥${fmtYen(s.pureTotal)}</div>
          </div>
          <div class="entry-row-tap" data-date="${d}" style="cursor:pointer;">
            <div class="entry-fare">¥${fmtYen(s.hourly)}<span style="font-size:10px;color:var(--muted2);">/h</span></div>
          </div>
          <button class="entry-del" data-del-date="${d}" title="削除">✕</button>
        </div>
      </div>`;
  };

  const groupTotal = (dArr) => {
    let count = 0, total = 0;
    dArr.forEach(d=>{
      const st = loadShiftByDate(d);
      if(!st) return;
      const s = summarizeShift(st);
      count += 1; total += s.pureTotal;
    });
    return {count, total};
  };

  let rows = '';
  for(const [y, monthMap] of yearMap){
    const yearDates = [...monthMap.values()].flat();
    const yTotal = groupTotal(yearDates);
    const yExpanded = historyExpandedYears.has(y);
    rows += `
      <div class="hist-year-header" data-year="${y}" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 4px;font-size:12.5px;font-weight:700;color:var(--text);border-top:1px solid var(--border);">
        <span>${yExpanded?'▾':'▸'} ${y}年（${yTotal.count}回・¥${fmtYen(yTotal.total)}）</span>
      </div>`;
    if(!yExpanded) continue;
    for(const [m, mDates] of monthMap){
      const mTotal = groupTotal(mDates);
      const ymKey = `${y}-${m}`;
      const mExpanded = historyExpandedMonths.has(ymKey);
      rows += `
        <div class="hist-month-header" data-ym="${ymKey}" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:6px 4px 6px 14px;font-size:11px;font-weight:600;color:var(--muted);">
          <span>${mExpanded?'▾':'▸'} ${parseInt(m,10)}月（${mTotal.count}回・¥${fmtYen(mTotal.total)}）</span>
        </div>`;
      if(!mExpanded) continue;
      rows += mDates.map(dateRowHTML).join('');
    }
  }

  document.getElementById('historyView').innerHTML = `
    <div style="padding:4px 2px 10px;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:13px;font-weight:700;">過去の出番</div>
      <button class="summary-close" id="historyCloseBtn">✕</button>
    </div>
    <div class="list-card">
      ${rows || '<div class="empty">まだ記録がありません</div>'}
    </div>
  `;
  document.getElementById('historyCloseBtn').onclick = ()=>{ historyMode = false; render(); };
  document.querySelectorAll('#historyView .hist-year-header').forEach(el=>{
    el.onclick = ()=>{
      const y = el.dataset.year;
      if(historyExpandedYears.has(y)) historyExpandedYears.delete(y); else historyExpandedYears.add(y);
      render();
    };
  });
  document.querySelectorAll('#historyView .hist-month-header').forEach(el=>{
    el.onclick = ()=>{
      const ym = el.dataset.ym;
      if(historyExpandedMonths.has(ym)) historyExpandedMonths.delete(ym); else historyExpandedMonths.add(ym);
      render();
    };
  });
  document.querySelectorAll('#historyView .entry-row-tap').forEach(el=>{
    el.onclick = ()=>{ historyDetailDate = el.dataset.date; render(); };
  });
  document.querySelectorAll('#historyView .entry-del').forEach(btn=>{
    btn.onclick = (ev)=>{
      ev.stopPropagation();
      const d = btn.dataset.delDate;
      showConfirm(`${fmtDateLabel(d)}の出番データを削除しますか?元に戻せません。`, async ()=>{
        try{ localStorage.removeItem(LS_PREFIX+'shift:'+d); }catch(e){}
        trackDelete(d);
        if(state.shiftDate===d && state.depTime!==null){
          await clearCurrentPointer();
          state = {depTime:null, shiftDate:null, returnTime:null, entries:[], selType:'連配GO', selPay:'GOPay', selThanks:false};
        }
        render();
        toast('削除しました');
      });
    };
  });
}
function totalRowHTML_section(rows, overallHourly, overallActualRate){

// SECTION_LABELS = ['〜12時','12〜16時','16〜20時','20〜22時','22時〜']
// 各区切り時刻(12/16/20/22時)ごとに、対応する区間行(index0〜3)の直下に累計行を挿入する。
// SECTION_TARGETSの目標(税込)に対する達成率は、専用の「達成率」列(累計行・合計行のみ値あり)に表示する。
function sectionRowsHTML(sectionRows, opts){
  opts = opts || {};
  const suppressCum = !!opts.suppressCum;
  if(!sectionRows.some(r=>r.hasData)){
    return `<tr><td colspan="7" class="empty" style="border:none;">記録がありません</td></tr>`;
  }
  let cumLabel;
  if(suppressCum){
    cumLabel = {};
  } else if(opts.cumIndices){
    cumLabel = {};
    opts.cumIndices.forEach(i=>{ cumLabel[i] = '累計'; });
  } else {
    cumLabel = {0:'累計', 1:'累計', 2:'累計', 3:'累計'};
  }
  let html = '';
  sectionRows.forEach((r, i)=>{
    if(r.hasData){
      html += `
    <tr>
      <td class="label">${r.label}</td>
      <td>${r.secCount}組</td>
      <td>¥${fmtYen(r.secTotal)}</td>
      <td>¥${fmtYen(r.secUnit)}</td>
      <td class="${r.secHourly<6000?'neg':'pos'}">¥${fmtYen(r.secHourly)}/h</td>
      <td>—</td>
      <td title="${(r.secLegKm!=null&&r.secActualKm!=null)?('区間走行距離'+r.secLegKm.toFixed(1)+'km中、実車'+r.secActualKm.toFixed(1)+'km'):''}">${r.secActualRate!=null?r.secActualRate.toFixed(1)+'%':'—'}</td>
    </tr>`;
    }
    if(cumLabel[i]){
      const upTo = sectionRows.slice(0, i+1);
      const count = upTo.reduce((s,x)=>s+x.secCount,0);
      const total = upTo.reduce((s,x)=>s+x.secTotal,0);
      const unit = count? total/count : 0;
      const elapsedSum = upTo.reduce((s,x)=>s+(x.secElapsed||0),0);
      const hourly = elapsedSum>0 ? total/elapsedSum : null;
      const legSum = upTo.reduce((s,x)=>s+(x.secLegKm||0),0);
      const actualSum = upTo.reduce((s,x)=>s+(x.secActualKm||0),0);
      const actualRate = legSum>0 ? Math.min(actualSum/legSum*100, 100) : null;
      const target = SECTION_TARGETS[i];
      const achieved = (target>0 && count>0) ? total/target*100 : null;
      const achievedCell = achieved!=null ? `<span class="${achieved>=100?'pos':'neg'}">${achieved.toFixed(0)}%</span>` : '—';
      html += `
    <tr class="cum-row">
      <td class="label">${cumLabel[i]}</td>
      <td>${count}組</td>
      <td>¥${fmtYen(total)}</td>
      <td>¥${fmtYen(unit)}</td>
      <td class="${hourly!=null?(hourly<6000?'neg':'pos'):''}">${hourly!=null?'¥'+fmtYen(hourly)+'/h':'—'}</td>
      <td>${achievedCell}</td>
      <td>${actualRate!=null?actualRate.toFixed(1)+'%':'—'}</td>
    </tr>`;
    }
  });
  return html;
}
function totalRowHTML_dist(rows, overallHourly, overallActualRate, totalDistKm){

// 距離帯ごとの行の直後に、そこまでの累計(組数・運賃・単価・時間単価・実車率)を独立行として挿入する。
// rows は距離順(近い方から)に並んでいる前提。opts.every: 何行ごとに累計行を挟むか(既定1=毎行)。
// opts.binSizeKm を指定すると、累計行のラベルを「〜Xkm 累計」形式にする(未指定時は「累計」固定)。
// opts.totalDistKm には実際の走行距離合計を渡す(達成率の目標算出は名目上の区切り数ではなく、この実測値を基準にする)。
function distBinRowsHTML(rows, opts){
  opts = opts || {};
  const every = opts.every || 1;
  if(!rows.length){
    return `<tr><td colspan="7" class="empty" style="border:none;">${opts.emptyText || '記録がありません'}</td></tr>`;
  }
  const binSizeKm = opts.binSizeKm || DIST_BIN_KM; // ラベル表示・区切り判定に使う
  const totalDistKm = opts.totalDistKm; // 達成率の目標算出に使う実測の総走行距離
  let runCount=0, runTotal=0, runElapsed=0, runLeg=0, runActual=0;
  let html = '';
  rows.forEach((r, i)=>{
    html += `
    <tr>
      <td class="label">${r.label}</td>
      <td>${r.count}組</td>
      <td>¥${fmtYen(r.total)}</td>
      <td>¥${fmtYen(r.unit)}</td>
      <td class="${r.hourly<6000?'neg':'pos'}">¥${fmtYen(r.hourly)}/h</td>
      <td>—</td>
      <td title="${(r.legKm!=null&&r.actualKm!=null)?('区間走行距離'+r.legKm.toFixed(1)+'km中、実車'+r.actualKm.toFixed(1)+'km'):''}">${r.actualRate!=null?r.actualRate.toFixed(1)+'%':'—'}</td>
    </tr>`;
    runCount += r.count;
    runTotal += r.total;
    runElapsed += r.elapsed||0;
    if(r.legKm){ runLeg += r.legKm; runActual += (r.actualKm||0); }
    if((i+1) % every !== 0) return;
    if(opts.suppressCum) return;
    const cumUnit = runCount? runTotal/runCount : 0;
    const cumHourly = runElapsed>0 ? runTotal/runElapsed : null;
    const cumRate = runLeg>0 ? Math.min(runActual/runLeg*100, 100) : null;
    const cumLabel = (every>1 && opts.binSizeKm) ? `〜${(i+1)*opts.binSizeKm}km 累計` : '累計';
    // 達成率の分母は実測の走行距離を優先する(名目上の区切り数×区切り幅だと、区切り幅が異なる画面間で
    // 同じ出番でも達成率が変わってしまうため)。実測値が無い場合のみ、従来通り区切り数から概算する。
    const kmSoFar = (totalDistKm!=null) ? Math.min((i+1)*binSizeKm, totalDistKm) : (i+1)*binSizeKm;
    const distTarget = kmSoFar/25*10000; // 25kmごとに¥10,000のペース目標
    const distAchieved = distTarget>0 ? runTotal/distTarget*100 : null;
    const distAchievedCell = distAchieved!=null ? `<span class="${distAchieved>=100?'pos':'neg'}">${distAchieved.toFixed(0)}%</span>` : '—';
    html += `
    <tr class="cum-row">
      <td class="label">${cumLabel}</td>
      <td>${runCount}組</td>
      <td>¥${fmtYen(runTotal)}</td>
      <td>¥${fmtYen(cumUnit)}</td>
      <td class="${cumHourly!=null?(cumHourly<6000?'neg':'pos'):''}">${cumHourly!=null?'¥'+fmtYen(cumHourly)+'/h':'—'}</td>
      <td>${distAchievedCell}</td>
      <td>${cumRate!=null?cumRate.toFixed(1)+'%':'—'}</td>
    </tr>`;
  });
  return html;
}

// html2canvas はSVG内のCSS変数(var(--xxx))をうまく解決できず画像化に失敗することがあるため、
// SVGを返す直前にvar(--xxx)を実際の色コードに置き換えておく。
function resolveCssVarsInSvg(svgStr){
  return svgStr.replace(/var\(--([a-zA-Z0-9-]+)\)/g, (m, name)=>{
    const val = getComputedStyle(document.body).getPropertyValue('--'+name).trim();
    return val || m;
  });
}

// サマリー用の簡易棒グラフ(外部ライブラリ非依存・SVG直書き)。
// items: [{label, value, valueLabel, color}] value=バーの高さに使う指標、valueLabel=バー上部に出す数値ラベル、color=CSS色(var(--xxx)可)
function svgBarChart(items, opts){
  opts = opts || {};
  if(!items || !items.length) return `<div style="text-align:center;color:var(--muted2);font-size:10.5px;padding:14px 0;">データがありません</div>`;
  const H = opts.height || 92;
  const barW = 30, gap = 14;
  const n = items.length;
  const W = Math.max(n*(barW+gap)+gap, 120);
  const maxVal = Math.max(...items.map(it=>Math.max(it.value||0,0)), 1);
  const baseY = H - 16;
  const topPad = 15;
  const usableH = baseY - topPad;
  const bars = items.map((it,i)=>{
    const x = gap + i*(barW+gap);
    const v = Math.max(it.value||0, 0);
    const h = maxVal>0 ? Math.max((v/maxVal)*usableH, v>0?2:0) : 0;
    const y = baseY - h;
    const color = it.color || 'var(--amber)';
    const opacity = it.opacity!=null ? it.opacity : 1;
    const label = (it.label!=null?String(it.label):'').length>7 ? String(it.label).slice(0,6)+'…' : (it.label||'');
    return `<g>
      <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" style="fill:${color};opacity:${opacity};"></rect>
      <text x="${x+barW/2}" y="${Math.max(y-4,10)}" text-anchor="middle" style="font-size:9px;fill:var(--text);font-family:'PT Mono',monospace;">${it.valueLabel!=null?it.valueLabel:''}</text>
      <text x="${x+barW/2}" y="${baseY+11}" text-anchor="middle" style="font-size:8.5px;fill:var(--muted);">${label}</text>
    </g>`;
  }).join('');
  return resolveCssVarsInSvg(`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;overflow:visible;display:block;">
    <line x1="0" y1="${baseY}" x2="${W}" y2="${baseY}" style="stroke:var(--border);stroke-width:1;"></line>
    ${bars}
  </svg>`);
}
// 棒(薄い色)+折れ線 の複合グラフ。items: [{label, bar, barColor, line, lineLabel, lineColor}]
// bar=背景の棒(例:運賃合計), line=折れ線で強調する主指標(例:時間単価)
function svgComboChart(items, opts){
  opts = opts || {};
  if(!items || !items.length) return `<div style="text-align:center;color:var(--muted2);font-size:10.5px;padding:14px 0;">データがありません</div>`;
  const H = opts.height || 120;
  const barW = 28, gap = 16;
  const n = items.length;
  const axisW = 32;
  const chartW = Math.max(n*(barW+gap)+gap, 130);
  const W = axisW + chartW;
  const baseY = H - 16;
  const topPad = 30;
  const usableH = baseY - topPad;
  const barScale = 0.7;
  const maxBar = Math.max(...items.map(it=>Math.max(it.bar||0,0)), 1);
  const maxLine = Math.max(...items.map(it=>Math.max(it.line||0,0)), 1);
  const points = items.map((it,i)=>{
    const x = axisW + gap + i*(barW+gap) + barW/2;
    const lv = Math.max(it.line||0,0);
    const y = baseY - (lv/maxLine)*usableH;
    return {x, y, it};
  });
  const bars = items.map((it,i)=>{
    const x = axisW + gap + i*(barW+gap);
    const bv = Math.max(it.bar||0,0);
    const h = maxBar>0 ? Math.max((bv/maxBar)*usableH*barScale, bv>0?2:0) : 0;
    const y = baseY - h;
    const color = it.barColor || 'var(--amber-dim)';
    const label = (it.label!=null?String(it.label):'').length>7 ? String(it.label).slice(0,6)+'…' : (it.label||'');
    return `<g>
      <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" style="fill:${color};opacity:0.55;"></rect>
      <text x="${x+barW/2}" y="${(baseY-4).toFixed(1)}" text-anchor="middle" style="font-size:6.5px;fill:var(--text);font-family:'PT Mono',monospace;">¥${fmtYen(bv)}</text>
      <text x="${x+barW/2}" y="${baseY+11}" text-anchor="middle" style="font-size:8.5px;fill:var(--muted);">${label}</text>
    </g>`;
  }).join('');
  // 縦軸(運賃/棒の目盛り): 0・中間・最大の3段階
  const axisTicks = [0, 0.5, 1].map(f=>{
    const val = maxBar*f;
    const y = baseY - usableH*barScale*f;
    return `<line x1="${axisW-3}" y1="${y.toFixed(1)}" x2="${axisW}" y2="${y.toFixed(1)}" style="stroke:var(--border);stroke-width:1;"></line>
      <text x="${axisW-6}" y="${(y+2.5).toFixed(1)}" text-anchor="end" style="font-size:6px;fill:var(--muted2);font-family:'PT Mono',monospace;">${fmtYen(val)}</text>`;
  }).join('');
  const linePath = points.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const lineDots = points.map(p=>{
    const it = p.it;
    const dotColor = it.lineColor || 'var(--amber)';
    return `<g>
      <circle cx="${p.x}" cy="${p.y}" r="3" style="fill:${dotColor};"></circle>
      <text x="${p.x}" y="${Math.max(p.y-6,10)}" text-anchor="middle" style="font-size:9px;fill:var(--text);font-family:'PT Mono',monospace;">${it.lineLabel!=null?it.lineLabel:''}</text>
    </g>`;
  }).join('');
  return resolveCssVarsInSvg(`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;overflow:visible;display:block;">
    <line x1="${axisW}" y1="${baseY}" x2="${W}" y2="${baseY}" style="stroke:var(--border);stroke-width:1;"></line>
    ${axisTicks}
    ${bars}
    <path d="${linePath}" style="fill:none;stroke:var(--amber-dim);stroke-width:2;opacity:0.9;"></path>
    ${lineDots}
  </svg>`);
}
function buildDistBinChartHTML(distBinRows){

// 1出番内の各乗務(組)の時間単価を乗務順(時系列)で表示。乗務数が多くても横スクロールせず固定幅に収まる(文字は自動的に小さくなる)。
// 各乗務の時間単価は「直前の乗務(または出庫)からの経過時間」に対するその乗務の運賃で計算。
function svgTimeSeriesChart(items, opts){
  opts = opts || {};
  if(!items || !items.length) return `<div style="text-align:center;color:var(--muted2);font-size:10.5px;padding:14px 0;">データがありません</div>`;
  const H = opts.height || 120;
  const n = items.length;
  const axisW = 32;
  const W = 300 + axisW;
  const padX = 12;
  const baseY = H - 16;
  const topPad = 22;
  const usableH = baseY - topPad;
  const usableW = (300) - padX*2;
  const hasLine2 = items.some(it=>it.value2!=null);
  const maxVal = Math.max(...items.map(it=>Math.max(it.value||0, it.value2||0, 0)), 1);
  const hasBar = items.some(it=>it.bar!=null);
  const barScale = 0.85;
  const maxBar = Math.max(...items.map(it=>Math.max(it.bar||0,0)), 1);
  const stepX = n>1 ? usableW/(n-1) : 0;
  const barW = Math.max(Math.min(stepX*0.55, 10), 2);
  const points = items.map((it,i)=>{
    const x = axisW + padX + i*stepX;
    const v = Math.max(it.value||0, 0);
    const y = baseY - (v/maxVal)*usableH;
    return {x, y, v, it};
  });
  const labelEvery = n<=8 ? 1 : n<=16 ? 2 : n<=30 ? 3 : n<=50 ? 5 : Math.ceil(n/8);
  // 要所(値ラベルを出す点): 最大値・最小値・最終点を優先し、既存の選択と横方向に近すぎる点は間引く(重なり防止)。
  function pickKeyIndices(minPxGap){
    let maxI=0, minI=0;
    points.forEach((p,i)=>{ if(p.v>points[maxI].v) maxI=i; if(p.v<points[minI].v) minI=i; });
    const forced = [maxI, minI, points.length-1];
    const kept = new Set();
    const keptX = [];
    function tryAdd(idx){
      const x = points[idx].x;
      if(keptX.every(kx=>Math.abs(kx-x)>=minPxGap)){ kept.add(idx); keptX.push(x); }
    }
    forced.forEach(tryAdd);
    for(let i=0;i<points.length;i+=labelEvery) tryAdd(i);
    return kept;
  }
  const keyIdx = pickKeyIndices(14); // 折れ線の値ラベル用(縦位置がずれるので間隔は控えめでよい)
  const barLabelIdx = pickKeyIndices(30); // 棒の根元の金額ラベル用(同じ高さに並ぶため広めの間隔が必要)
  const bars = hasBar ? points.map((p,i)=>{
    const bv = Math.max(p.it.bar||0, 0);
    const h = maxBar>0 ? Math.max((bv/maxBar)*usableH*barScale, bv>0?1.5:0) : 0;
    const y = baseY - h;
    const amtLabel = barLabelIdx.has(i) ? `<text x="${p.x.toFixed(1)}" y="${(baseY-3).toFixed(1)}" text-anchor="middle" style="font-size:6px;fill:var(--text);font-family:'PT Mono',monospace;">¥${fmtYen(bv)}</text>` : '';
    return `<rect x="${(p.x-barW/2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" style="fill:var(--amber-dim);opacity:0.4;"></rect>${amtLabel}`;
  }).join('') : '';
  // 縦軸(運賃/棒の目盛り): 0・中間・最大の3段階
  const axisTicks = hasBar ? [0, 0.5, 1].map(f=>{
    const val = maxBar*f;
    const y = baseY - usableH*barScale*f;
    return `<line x1="${axisW-3}" y1="${y.toFixed(1)}" x2="${axisW}" y2="${y.toFixed(1)}" style="stroke:var(--border);stroke-width:1;"></line>
      <text x="${axisW-6}" y="${(y+2.5).toFixed(1)}" text-anchor="end" style="font-size:6px;fill:var(--muted2);font-family:'PT Mono',monospace;">${fmtYen(val)}</text>`;
  }).join('') : '';
  const path = points.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const dots = points.map((p,i)=>{
    const it = p.it;
    const color = it.color || 'var(--amber)';
    const showTimeLabel = (i % labelEvery === 0) || i === points.length - 1;
    const showValueLabel = keyIdx.has(i);
    return `<g>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.6" style="fill:${color};"></circle>
      ${showValueLabel ? `<text x="${p.x.toFixed(1)}" y="${Math.max(p.y-5,9).toFixed(1)}" text-anchor="middle" style="font-size:6.5px;fill:var(--text);font-family:'PT Mono',monospace;">¥${Math.round(p.v).toLocaleString('ja-JP')}</text>` : ''}
      ${showTimeLabel ? `<text x="${p.x.toFixed(1)}" y="${baseY+11}" text-anchor="middle" style="font-size:7px;fill:var(--muted);font-family:'PT Mono',monospace;">${it.label!=null?it.label:''}</text>` : ''}
    </g>`;
  }).join('');
  // 第2の折れ線(組単価など): 破線+白抜きの点。値ラベルは最終点のみ(重なり防止のため時間単価の点より下なら下側、上なら上側に出す)。
  let line2 = '';
  if(hasLine2){
    const pts2 = items.map((it,i)=>({x:points[i].x, y: baseY - (Math.max(it.value2||0,0)/maxVal)*usableH, v: Math.max(it.value2||0,0)}));
    const path2 = pts2.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
    const dots2 = pts2.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2" style="fill:var(--card);stroke:var(--text);stroke-width:1.2;"></circle>`).join('');
    const last = pts2[pts2.length-1];
    const below = last.y >= points[points.length-1].y;
    const ly = below ? Math.min(last.y+9, baseY-2) : Math.max(last.y-5, 9);
    const lbl2 = `<text x="${last.x.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" style="font-size:6.5px;fill:var(--text);font-weight:700;font-family:'PT Mono',monospace;">¥${Math.round(last.v).toLocaleString('ja-JP')}</text>`;
    line2 = `<path d="${path2}" style="fill:none;stroke:var(--text);stroke-width:1.2;stroke-dasharray:3 2;opacity:0.85;"></path>${dots2}${lbl2}`;
  }
  return resolveCssVarsInSvg(`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;overflow:visible;display:block;">
    <line x1="${axisW}" y1="${baseY}" x2="${W}" y2="${baseY}" style="stroke:var(--border);stroke-width:1;"></line>
    ${axisTicks}    ${bars}
    <path d="${path}" style="fill:none;stroke:var(--amber-dim);stroke-width:1.5;opacity:0.8;"></path>
    ${dots}
    ${line2}
  </svg>`);
}
// withUnit=true で累計組単価(その時点までの運賃合計÷組数。メーターの組単価と同じ定義)を破線で重ねる(出動中・まとめ・履歴詳細の3画面)。
function buildEntryHourlyTimeSeriesChartHTML(entries, depTime, withUnit){
  if(depTime===null || depTime===undefined) return `<div style="text-align:center;color:var(--muted2);font-size:10.5px;padding:14px 0;">データがありません</div>`;
  const sorted = [...entries].sort((a,b)=>a.time-b.time);
  let cumFare = 0;
  const items = [];
  sorted.forEach((e)=>{
    if(isBillable(e)){
      const fare = netFare(e);
      cumFare += fare;
      const elapsedFromDep = Math.max(e.time - depTime, 0.0167);
      const rate = cumFare / elapsedFromDep;
      const color = rate<4000 ? 'var(--red)' : rate<6000 ? 'var(--amber)' : 'var(--green)';
      const it = {label: fmtTime(e.time), value: rate, bar: fare, color};
      if(withUnit){
        // 組単価=その時点までの運賃合計(障割含む・isFareable)÷組数(billableを同時刻で1件に集約)。メーターの組単価と同じ定義。
        const upTo = sorted.filter(x=>x.time<=e.time);
        const fareSum = upTo.filter(isFareable).reduce((a,x)=>a+netFare(x),0);
        const cnt = dedupeByTime(upTo.filter(isBillable)).length;
        it.value2 = cnt>0 ? fareSum/cnt : 0;
      }
      items.push(it);
    }
  });
  return svgTimeSeriesChart(items, {height:126});
}
// 1出番内の各乗務(組)の時間単価をゾーン(価格帯)ごとに分布表示。件数が多くてもスクロール不要でスクショに収まる。
// 各乗務の時間単価は「直前の乗務(または出庫)からの経過時間」に対するその乗務の運賃で計算(個々の乗務の実際の稼ぎを見る指標)。
function buildEntryHourlyZoneChartHTML(entries, depTime){
  if(depTime===null || depTime===undefined) return `<div style="text-align:center;color:var(--muted2);font-size:10.5px;padding:14px 0;">データがありません</div>`;
  const sorted = [...entries].sort((a,b)=>a.time-b.time);
  const zones = [
    {label:'〜4,000', max:4000, color:'var(--red)', opacity:1},
    {label:'4,000〜5,000', max:5000, color:'var(--red)', opacity:0.55},
    {label:'5,000〜6,000', max:6000, color:'var(--amber)', opacity:0.9},
    {label:'6,000〜7,000', max:7000, color:'var(--green)', opacity:0.55},
    {label:'7,000〜', max:Infinity, color:'var(--green)', opacity:1}
  ];
  const counts = zones.map(()=>0);
  let prevTime = depTime;
  sorted.forEach(e=>{
    if(isBillable(e)){
      const elapsed = Math.max(e.time - prevTime, 0.0167);
      const rate = netFare(e) / elapsed;
      let zi = zones.findIndex(z=>rate < z.max);
      if(zi===-1) zi = zones.length - 1;
      counts[zi]++;
    }
    prevTime = e.time;
  });
  const items = zones.map((z,i)=>({
    label: z.label, value: counts[i], valueLabel: counts[i]+'件',
    color: z.color, opacity: z.opacity
  }));
  return svgBarChart(items, {height:100});
}

      st.entries = st.entries.filter(e=>e.id!==entryId);

      if(state.shiftDate===date && state.depTime!==null){
        state.entries = state.entries.filter(e=>e.id!==entryId);
        await saveState();
      }
      overlay.remove();
      render();
      toast('削除しました');
    });
  };

}

  const analysisItemsH = buildAnalysis(s, sectionRows, entries, distBinRows, arH, {go:goCancelCountH, musen:musenCancelCountH}, date, st.weather);

}
